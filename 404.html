<script>
  // A reloaded or shared demo page (/hangar/demo/repositories) has no file on a static host:
  // open the demo with the page in its hash, which the demo turns back into the path.
  (function () {
    var m = location.pathname.match(/^(.*\/demo)(\/.*)$/);
    if (m && m[2] !== '/') location.replace(m[1] + '/#' + m[2] + location.search);
  })();
</script>
