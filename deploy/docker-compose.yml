# Hangar development stack: PostgreSQL, MinIO, NATS JetStream, Trivy server and
# Hangar itself, with throwaway credentials and every port published.
# For production use deploy/compose/ (docs/deploy/install-compose.md).
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   open http://localhost:8080
#
# For development, `make dev-deps` starts only the dependencies and `make dev`
# runs hangar from source against them. Credentials below are local
# development defaults; override them with an .env file next to this one.

name: hangar

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 20

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hangar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hangar}
      POSTGRES_DB: ${POSTGRES_DB:-hangar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  # S3-compatible object storage. Upstream MinIO no longer publishes container
  # images; this is a community build of the same server.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hangar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hangar-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio:/data

  # Creates the blob bucket once MinIO answers.
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hangar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hangar-secret}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        for i in $$(seq 1 60); do
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && break;
        sleep 1; done;
        mc mb --ignore-existing local/hangar
    restart: "no"

  nats:
    image: nats:2.11-alpine
    command: ["nats-server", "--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz?js-enabled-only=true"]

  # Vulnerability scanner in client/server mode.
  trivy:
    image: aquasec/trivy:0.76.1
    command: ["server", "--listen", "0.0.0.0:4954", "--cache-dir", "/cache"]
    ports:
      - "${TRIVY_PORT:-4954}:4954"
    volumes:
      - trivy:/cache
    healthcheck:
      <<: *healthcheck
      retries: 60
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4954/healthz"]

  hangar:
    build:
      context: ..
      dockerfile: Dockerfile
    image: hangar:dev
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      HANGAR_SERVER_BASE_URL: ${HANGAR_BASE_URL:-http://localhost:8080}
      HANGAR_DATABASE_URL: postgres://${POSTGRES_USER:-hangar}:${POSTGRES_PASSWORD:-hangar}@postgres:5432/${POSTGRES_DB:-hangar}?sslmode=disable
      HANGAR_DATABASE_MIGRATE_ON_START: "true"
      HANGAR_STORAGE_KIND: s3
      HANGAR_STORAGE_S3_ENDPOINT: http://minio:9000
      HANGAR_STORAGE_S3_BUCKET: hangar
      HANGAR_STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-hangar}
      HANGAR_STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-hangar-secret}
      # Development only: stable registry tokens across restarts, plain-HTTP cookies.
      HANGAR_DOCKER_TOKEN_KEY: ${HANGAR_DOCKER_TOKEN_KEY:-dev-only-token-key-change-me-0123456789abcdef}
      HANGAR_BOOTSTRAP_ADMIN_USER: ${HANGAR_BOOTSTRAP_ADMIN_USER:-admin}
      HANGAR_BOOTSTRAP_ADMIN_PASSWORD: ${HANGAR_BOOTSTRAP_ADMIN_PASSWORD:-hangar-dev-password}
      HANGAR_NATS_EMBEDDED: "false"
      HANGAR_NATS_URL: nats://nats:4222
      HANGAR_SCANNER_TRIVY_URL: http://trivy:4954
      # Corporate networks: outbound proxy for proxy repositories.
      HANGAR_HTTP_PROXY: ${HANGAR_HTTP_PROXY:-}
      HANGAR_HTTP_NO_PROXY: ${HANGAR_HTTP_NO_PROXY:-}
    ports:
      - "${HANGAR_PORT:-8080}:8080"
    volumes:
      - hangar:/var/lib/hangar

volumes:
  postgres:
  minio:
  nats:
  trivy:
  hangar:
