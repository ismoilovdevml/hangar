openapi: 3.1.0
info:
  title: Hangar API
  version: 0.1.0
  summary: REST API of the Hangar package registry (web UI and automation).
  description: |
    JSON REST API served under `/api/v1`. Package clients (docker, npm, mvn, ...)
    do not use this API; they speak their own protocols under `/repository/<repo>/`
    and `/v2/`.

    Conventions:
    - JSON field names are `snake_case`. Timestamps are RFC 3339 strings in UTC.
      Durations are Go duration strings (`"24h0m0s"`, `"90s"`). Sizes are bytes.
    - Lists are cursor-paginated: pass `limit` and the previous page's
      `next_cursor` as `cursor`. `next_cursor` is null or absent on the last page.
    - Every non-2xx response has the `Error` body.
    - Actions on a resource are sub-resources with POST (`/tasks/{id}/run`).
    - Authentication: session cookie (browser), or `Authorization: Bearer hgr_...`
      (personal access / service-account token), or HTTP Basic with a token as
      the password. Every mutating call is authorized and audited.
    - A local user who must change their password (the generated first
      administrator, a one-time password, or an administrator's request) and
      signs in with that password may only call `GET /auth/session`,
      `PUT /me/password` and `POST /auth/logout` (plus the endpoints open to
      everyone, served as for a visitor). Every other call answers 403 with
      code `password_change_required`. Their access tokens are not affected.
    - `GET /auth/session` (or `GET /me`) tells the caller what it may do: its
      effective privileges and, for tokens, the scopes, restrictions and expiry.
    - Requests are rate-limited per client address; a 429 answer carries
      `Retry-After`. Retry 429 and 5xx answers with backoff, never other 4xx.
    - Operations marked `x-status: planned` are part of the published design
      but not implemented yet: the server authenticates the call and answers
      501 with code `not_implemented`. Do not build on them until the marker
      is gone.

    This document is served at `/api/v1/openapi.yaml` (and `.json`), rendered
    at `/api-docs`; `/api/v1/automation-guide.md` is a short guide for scripts and
    other automated clients, indexed by `/llms.txt`.
  license:
    name: See repository
    url: https://github.com/ismoilovdevml/hangar
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
  - basicAuth: []
tags:
  - name: auth
    description: Sign-in, the current session and what the caller may do.
  - name: docs
    description: This document and the guide for automated clients; public.
  - name: system
    description: Version, health, nodes and logs of the server.
  - name: overview
    description: Numbers for the Overview screen.
  - name: repositories
    description: Hosted, proxy and group repositories.
  - name: blob-stores
    description: Where package bytes are stored.
  - name: components
    description: Packages (components), their versions and files (assets).
  - name: search
    description: Search across every repository the caller can read.
  - name: security
    description: Vulnerability findings, waivers and scans.
  - name: cleanup
    description: Cleanup policies and their runs.
  - name: tasks
    description: Scheduled maintenance tasks and their runs.
  - name: access
    description: Users, service accounts, roles and access tokens.
  - name: settings
    description: Sign-in providers and outbound proxies.
  - name: audit
    description: The audit log.
  - name: cluster
    description: Nodes and replication.
  - name: events
    description: Server-sent events for live updates.

paths:
  # ---------------------------------------------------------------- auth
  /auth/providers:
    get:
      tags: [auth]
      operationId: getAuthProviders
      summary: Sign-in methods offered on the login screen
      security: []
      responses:
        "200":
          description: Configured providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthProviders" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Local or LDAP username/password login; sets the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in. `Set-Cookie` carries the session.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423":
          description: Account locked after repeated failures; `retry_after` says when to retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            Realm `ldap`: the directory account may not sign in (`allowed_groups`,
            or `auto_create` is off and the user never signed in before).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            Realm `ldap`: the username already belongs to a local user, a service
            account or another external identity, which is never taken over.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Realm `ldap`, the directory cannot be reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/oidc/start:
    get:
      tags: [auth]
      operationId: startOidcLogin
      summary: Start single sign-on with the OIDC provider
      description: |
        Redirects the browser to the provider (authorization code flow with PKCE).
        The state, nonce and code verifier travel in a short-lived, encrypted,
        HttpOnly cookie scoped to `/api/v1/auth/oidc`. On failure the browser is
        sent to `/login?error=sso_unavailable`.
      security: []
      parameters:
        - name: redirect
          in: query
          description: In-app path to open after sign-in (same origin only; anything else becomes `/`)
          schema: { type: string, example: /repositories }
      responses:
        "302": { description: Redirect to the provider's authorization endpoint }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/oidc/callback:
    get:
      tags: [auth]
      operationId: finishOidcLogin
      summary: Redirect URI registered at the OIDC provider
      description: |
        Verifies the state, exchanges the code, verifies the ID token (signature,
        issuer, audience, expiry, nonce), provisions or updates the user, re-syncs
        roles granted by group mapping and starts a session. Success redirects to
        the path given to `/auth/oidc/start`; failure redirects to
        `/login?error=<code>` with code `sso_state`, `sso_failed`, `sso_unavailable`,
        `access_denied`, `group_denied`, `account_conflict`, `account_disabled`,
        `not_provisioned`, `invalid_profile` or `rate_limited`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, description: Set by the provider when it refused, schema: { type: string } }
      responses:
        "302":
          description: Signed in (`Set-Cookie` carries the session), or sent back to the login page
          headers:
            Set-Cookie:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      description: |
        Ends the Hangar session. A single sign-on session with
        `auth.oidc.logout: provider` (the default) also ends at the identity
        provider (OpenID Connect RP-Initiated Logout): the answer is 200 with
        the provider's `end_session_endpoint` URL (with `id_token_hint`,
        `client_id` and `post_logout_redirect_uri` = `<base_url>/login`) to
        send the browser to. Without such an endpoint, or with
        `auth.oidc.logout: local`, the answer is 204. Back-channel logout is
        not supported.
      responses:
        "200":
          description: Signed out of Hangar; send the browser to `logout_url` to sign out of the provider too
          content:
            application/json:
              schema:
                type: object
                required: [logout_url]
                properties:
                  logout_url: { type: string, format: uri }
        "204": { description: Signed out }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current user and organization
      description: |
        With `password_change_required` the session is limited to this call,
        `PUT /me/password` and `POST /auth/logout` until the password is changed.
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Who the caller is and what it may do (same body as /auth/session)
      description: |
        For automated clients: `privileges` are the effective privileges of
        this request (the owner's roles narrowed by the token's scopes) and
        `token` describes the token used, with its scopes, restrictions and
        expiry.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /openapi.yaml:
    get:
      tags: [docs]
      operationId: getOpenAPIYAML
      summary: This OpenAPI document as YAML
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/yaml:
              schema: { type: string }
  /openapi.json:
    get:
      tags: [docs]
      operationId: getOpenAPIJSON
      summary: This OpenAPI document as JSON
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /automation-guide.md:
    get:
      tags: [docs]
      operationId: getAutomationGuide
      summary: Guide for scripts and other automated clients, with this server's URLs
      description: |
        Markdown: base URL, authentication, the error body, pagination, rate
        limits and the most useful calls with examples. `/llms.txt` at the
        site root links to it and to this document.
      security: []
      responses:
        "200":
          description: The guide
          content:
            text/markdown:
              schema: { type: string }
  /me/client-endpoints:
    get:
      tags: [auth]
      operationId: listClientEndpoints
      summary: Endpoints the current user should configure in their clients, most-used format first
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Endpoints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientEndpointPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/profile:
    put:
      tags: [access]
      operationId: updateMyProfile
      summary: Change your own display name and email (local accounts)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/password:
    put:
      tags: [access]
      operationId: changeMyPassword
      summary: Change your own password
      description: |
        Needs the current password; wrong guesses count towards the account
        lockout. Not available to token-authenticated requests. Every other
        session of yours ends and short-lived session tokens are revoked;
        personal access tokens keep working. The session making the request is
        replaced by a new one (new cookie and CSRF token).

        When a password change was required (`password_change_required`), it
        clears that state, the new password must differ from the one given,
        the change is audited as `user.password.changed` with reason
        `first_login`, and the initial administrator password file is
        deleted if it held the old password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204":
          description: Changed; `Set-Cookie` carries the new session
          headers:
            Set-Cookie:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "423":
          description: Account locked after repeated wrong passwords
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /me/sessions:
    get:
      tags: [access]
      operationId: listMySessions
      summary: Your active browser sessions, most recently used first
      responses:
        "200":
          description: Sessions; `current` marks the one making the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfoList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [access]
      operationId: revokeMyOtherSessions
      summary: Sign out everywhere else (every session except the current one)
      responses:
        "200":
          description: Sessions ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionsEnded" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/sessions/{sid}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [access]
      operationId: revokeMySession
      summary: End one of your sessions (ending the current one signs you out)
      responses:
        "204": { description: Ended }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- system
  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Overall health, shown by every status indicator of the web UI
      description: |
        The rollup of the System status checks of every node (the same checks
        as `/system/nodes` and `/system/health`), so all of them agree. `state`
        and `message` are public; signed-in callers also get the failing checks
        in `problems`, and callers with `system:cluster:read` their detail and
        the dependency errors.
      security: []
      responses:
        "200":
          description: Status (always 200; read `state`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
  /system/version:
    get:
      tags: [system]
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildInfo" }
  /system/nodes:
    get:
      tags: [system]
      operationId: listSystemNodes
      summary: Every Hangar node with its role and subsystem health (System status screen)
      description: |
        This node is listed first with checks run now (reused for 5 s); other
        nodes come from the heartbeat each node writes every 15 s. A node
        silent for 45 s is `stale` and `down`; after an hour it is no longer
        listed. Requires `system:cluster:read`. When the database cannot be
        read only this node is returned, with `partial` set.
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemNodeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/health:
    get:
      tags: [system]
      operationId: getSystemHealth
      summary: Subsystem health of the node that answers, checked now
      description: |
        Database, blob stores, NATS / JetStream, task scheduler, search index,
        external sign-in and proxy upstreams, each `healthy`, `degraded` or
        `down` with a detail sentence and the time it was checked. Always
        200; read `status`. Requires `system:cluster:read`.
      responses:
        "200":
          description: This node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemNode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/logs:
    get:
      tags: [system]
      operationId: listSystemLogs
      summary: Recent log records of a node from its in-memory buffer
      description: |
        Each node keeps its newest `log.buffer_size` records (default 5000)
        in memory, scrubbed of credentials like the records written to
        stderr. Without `cursor` the newest `limit` matching records are
        returned (oldest first); pass the returned `cursor` to get only newer
        records, and `wait` to hold the request until one arrives (long poll).
        `cursor=0` reads the buffer from its oldest record (downloads). Other
        nodes are asked over NATS. Full logs stay in the container or journal
        output. Requires `system:cluster:admin`.
      parameters:
        - name: node
          in: query
          description: Node id from /system/nodes; default the node that answers
          schema: { type: string }
        - name: level
          in: query
          description: Minimum level; default every level the buffer holds
          schema: { type: string, enum: [debug, info, warn, error] }
        - name: q
          in: query
          description: Case-insensitive text in the message or attributes (at most 200 characters)
          schema: { type: string, maxLength: 200 }
        - name: since
          in: query
          description: RFC 3339 time, or a duration back from now such as `15m`
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
        - name: cursor
          in: query
          description: "`cursor` of an earlier page: return only records after it"
          schema: { type: string }
        - name: wait
          in: query
          description: With `cursor`, seconds to wait for a matching record (long poll)
          schema: { type: integer, minimum: 0, maximum: 30, default: 0 }
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemLogPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The node is not running or does not answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: The node did not answer in time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /formats:
    get:
      tags: [system]
      operationId: listFormats
      summary: Formats this server speaks (step 1 of "New repository")
      responses:
        "200":
          description: Formats
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FormatInfo" }

  # ---------------------------------------------------------------- overview
  /metrics/overview:
    get:
      tags: [overview]
      operationId: getOverviewMetrics
      summary: Every number on the Overview screen for one range
      parameters:
        - name: range
          in: query
          schema: { $ref: "#/components/schemas/OverviewRange" }
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverviewMetrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /upstreams/health:
    get:
      tags: [overview]
      operationId: listUpstreamHealth
      summary: Health of every proxy remote
      description: |
        Live state of each readable proxy repository's remote, plus the remote
        latency recorded over `range` by every node (persisted, so it survives
        restarts).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: range
          in: query
          description: Window of `latency_ms` and `requests` (default `today`)
          schema: { $ref: "#/components/schemas/OverviewRange" }
      responses:
        "200":
          description: Upstreams
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpstreamHealthPage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ---------------------------------------------------------------- repositories
  /repositories:
    get:
      tags: [repositories]
      operationId: listRepositories
      parameters:
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/RepositoryType" }
        - name: format
          in: query
          schema: { $ref: "#/components/schemas/Format" }
        - name: q
          in: query
          description: Substring of the repository name
          schema: { type: string }
        - name: sort
          in: query
          description: |
            Order of the list, before paging (default `name`). A leading `-` reverses it;
            ties are broken by name. Repositories without activity sort as the oldest.
          schema:
            type: string
            enum: [name, -name, type, -type, format, -format, last_activity, -last_activity]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Repositories, with counts for the tabs and count cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [repositories]
      operationId: createRepository
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryInput" }
          application/yaml:
            schema: { $ref: "#/components/schemas/RepositoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /repositories/{name}:
    parameters:
      - $ref: "#/components/parameters/RepositoryName"
    get:
      tags: [repositories]
      operationId: getRepository
      responses:
        "200":
          description: Repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
            application/yaml:
              description: >-
                Config-as-code form (with `Accept: application/yaml`): the
                RepositoryInput, ready to send back to POST /repositories or
                PUT /repositories/{name} as JSON. A `hangar apply -f` CLI is planned.
              schema: { $ref: "#/components/schemas/RepositoryInput" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [repositories]
      operationId: updateRepository
      description: |
        Replaces the settings. `name`, `format` and `type` are immutable.

        Upstream credentials of a proxy repository (`config.proxy.auth`) are
        write-only and follow these rules:

        - `auth` left out: the stored credentials are kept.
        - `"auth": null`: the credentials are removed.
        - `auth` sent with an empty `password` or `token` and the same
          `kind`, `username` and `header_name`: the stored secret is kept
          (send back what GET returns).
        - When `remote_url` moves to another scheme, host or port, stored
          secrets are never carried over: unless the request resends the
          password or token, or sets `"auth": null`, it is refused with 400.

        The audit record (`repository.update`) notes `upstream_auth`
        (`added`, `removed`, `replaced` or `unchanged`), never the secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [repositories]
      operationId: deleteRepository
      responses:
        "204": { description: Deleted (content is soft-deleted and reclaimed by compaction) }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Still a member of a group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /repositories/{name}/cache:invalidate:
    parameters:
      - $ref: "#/components/parameters/RepositoryName"
    post:
      tags: [repositories]
      operationId: invalidateRepositoryCache
      description: >-
        Proxy repositories only. Forgets the remote answers the repository
        remembers in memory on every node — 404s in the negative cache and
        rate-limit (429 Retry-After) holds — so the next request asks the
        remote again. Cached content is kept. Requires repository
        administration; audited as `repository.cache_invalidate`.
      responses:
        "200":
          description: Invalidated; counts are for the node that answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheInvalidation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repositories/{name}/routing:
    parameters:
      - $ref: "#/components/parameters/RepositoryName"
    get:
      tags: [repositories, security]
      operationId: getRepositoryRouting
      description: >-
        Routing rules of a proxy or group repository, the guard against
        dependency confusion (an internal package name published with a
        higher version on a public registry). The same rules are
        `config.routing` of the repository. Requires read access.
      responses:
        "200":
          description: The rules; empty lists when none are set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingRules" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [repositories, security]
      operationId: putRepositoryRouting
      description: >-
        Replaces the routing rules. Proxy repositories take `allow` and
        `block`; groups take `members` (rules for direct members only).
        Patterns use `*` and `?` on the format's package identity (NuGet ids
        and PyPI names case-insensitive and normalized, npm `@scope/name`,
        Maven `groupId:artifactId` or a bare groupId, Go module path
        prefixes in GOPRIVATE syntax, Cargo crates, Docker image paths, Helm
        charts, APT/RPM package names, raw paths). Empty rules clear them
        (204). Requires repository administration; audited as
        `repository.routing.update` with the rules before and after.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutingRules" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingRules" }
        "204": { description: Rules cleared }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [repositories, security]
      operationId: deleteRepositoryRouting
      description: Clears the routing rules. Requires repository administration; audited as `repository.routing.update`.
      responses:
        "204": { description: Rules cleared }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repositories/{name}/routing:test:
    parameters:
      - $ref: "#/components/parameters/RepositoryName"
    post:
      tags: [repositories, security]
      operationId: testRepositoryRouting
      description: >-
        Evaluates the stored rules for one package name without serving
        anything: for a proxy whether it may fetch and serve the name, for a
        group every member (nested groups depth-first) with the rule that
        excludes it and the first member that would serve it. Requires read
        access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Edcom.Common.Utils }
      responses:
        "200":
          description: Evaluation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingTest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repositories/{name}/routing:suggest:
    parameters:
      - $ref: "#/components/parameters/RepositoryName"
    get:
      tags: [repositories, security]
      operationId: suggestRepositoryRouting
      description: >-
        Suggests patterns from the names hosted repositories publish: for a
        group its hosted members (to make exclusive to the member named in
        `member`), for a proxy every hosted repository of the same format
        (to block on the proxy). Only repositories the caller may read are
        looked at, up to 5000 components each. Requires repository
        administration.
      responses:
        "200":
          description: Suggestions, most common first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingSuggestions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repositories/{name}:scan:
    parameters:
      - $ref: "#/components/parameters/RepositoryName"
    post:
      tags: [repositories, security]
      operationId: scanRepository
      description: >-
        Queues a vulnerability scan of every component of the repository
        (npm, Maven, PyPI, NuGet and Go repositories). Requires
        `system:security:write` or write access to the repository; audited as
        `repository.scan`. Repeated requests within the same minute are one scan.
      responses:
        "202":
          description: Scan queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryScanQueued" }
        "400":
          description: The format has no advisory source (e.g. Docker images)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: Scanning is turned off (`scanning.enabled`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /repositories/{name}/signing-key:
    parameters:
      - $ref: "#/components/parameters/RepositoryName"
    get:
      tags: [repositories]
      operationId: getSigningKey
      description: >-
        The OpenPGP key that signs the metadata of an apt or rpm hosted or
        group repository (APT InRelease and Release.gpg, RPM repomd.xml.asc),
        generated on first use. The private key never leaves the server.
        Clients download the public key from /repository/{name}/public.key
        (armored) or public.gpg (binary). Requires read access.
      responses:
        "200":
          description: Key details and the armored public key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: No `security.secret_key` is configured, so keys cannot be stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [repositories]
      operationId: importSigningKey
      description: >-
        Replaces the key with an existing private key (ASCII-armored or
        binary, optionally passphrase-protected). Metadata is signed with it
        at once; clients need the new public key. Requires repository
        administration, or `system:repos:admin` for the shared key; audited
        as `signing_key.import`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [private_key]
              properties:
                private_key: { type: string, description: The private key, e.g. `gpg --armor --export-secret-keys` }
                passphrase: { type: string }
      responses:
        "200":
          description: The imported key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: No `security.secret_key` is configured, so keys cannot be stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /repositories/{name}/signing-key:rotate:
    parameters:
      - $ref: "#/components/parameters/RepositoryName"
    post:
      tags: [repositories]
      operationId: rotateSigningKey
      description: >-
        Generates a new key (RSA 4096 by default, or Ed25519) and signs the
        metadata with it from now on; clients need the new public key.
        Requires repository administration, or `system:repos:admin` for the
        shared key; audited as `signing_key.rotate`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm: { type: string, enum: [rsa4096, ed25519] }
      responses:
        "200":
          description: The new key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: No `security.secret_key` is configured, so keys cannot be stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /repositories/{name}/browse:
    parameters:
      - $ref: "#/components/parameters/RepositoryName"
    get:
      tags: [repositories]
      operationId: browseRepository
      summary: Direct children of one folder of the repository's browse tree
      description: >-
        The tree follows what clients see: npm scopes, packages, files;
        Maven groupId segments, artifactId, version, files; NuGet id,
        version, files; PyPI project, files; Docker image path, then
        `manifests` (tags and digests) and `blobs`; raw directories.
        Folders that hold one package or one version are marked as such.
        Children sort in byte order of their storage path (a folder as its
        name followed by "/"). A group merges its members, in resolution
        order, limited to the members the caller may read; each entry names
        the member that holds it.
      parameters:
        - name: path
          in: query
          description: Folder in the browse tree, e.g. "@acme/" or "com/acme/ledger-core/"; empty for the root
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of children
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowsePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- blob stores
  /blob-stores:
    get:
      tags: [blob-stores]
      operationId: listBlobStores
      responses:
        "200":
          description: Stores and totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobStoreList" }
    post:
      tags: [blob-stores]
      operationId: createBlobStore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlobStoreInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobStore" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /blob-stores/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [blob-stores]
      operationId: getBlobStore
      responses:
        "200":
          description: Store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobStore" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [blob-stores]
      operationId: updateBlobStore
      description: |
        Name and kind cannot change. `soft_quota_bytes` (null or absent removes
        the quota), S3 credentials, region and path style can always change.
        The location (`fs.path`, S3 bucket, prefix, endpoint) can change only
        while the store holds no repositories and no blobs. A config section
        left out keeps the current one; an S3 secret left out keeps the stored
        secret unless `access_key_id` changes. Stores defined by the server
        configuration only accept a new soft quota. Requires
        `system:blobstores:admin`; audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlobStoreInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobStore" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`in_use`: the location of a store that holds content cannot change"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [blob-stores]
      operationId: deleteBlobStore
      description: |
        Deletes an empty store: no repository uses it and no blob (live or
        awaiting compaction) is recorded in it. Bytes in the backend are not
        touched. Stores defined by the server configuration cannot be deleted.
        Requires `system:blobstores:admin`; audited.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`in_use`: repositories or blobs still use the store, or it comes from the server configuration"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /blob-stores/{name}/move-repositories:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [blob-stores]
      operationId: moveRepositories
      x-status: planned
      summary: Start an online migration of repositories into this store
      description: Planned; not implemented yet (answers 501).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositories]
              properties:
                repositories:
                  type: array
                  items: { type: string }
      responses:
        "202":
          description: Migration task started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRun" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  # ---------------------------------------------------------------- components
  /components:
    get:
      tags: [components]
      operationId: listComponents
      summary: Components across repositories (Recently published, package lists)
      parameters:
        - name: repository
          in: query
          schema: { type: string }
        - name: format
          in: query
          schema: { $ref: "#/components/schemas/Format" }
        - name: name
          in: query
          description: Exact package name (all versions of one package)
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [-published_at, published_at, name, -downloads]
            default: -published_at
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Components
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedComponentPage" }
  /components/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [components]
      operationId: getComponent
      responses:
        "200":
          description: Package detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [components]
      operationId: deleteComponent
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /components/{id}/assets:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [components]
      operationId: listComponentAssets
      summary: Files (or OCI layers) of a component
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetPage" }
  /components/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [components]
      operationId: listComponentVersions
      summary: Other versions of the same package in the same repository
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedComponentPage" }
  /components/{id}/info:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [components]
      operationId: getComponentInfo
      summary: README, licences, keywords and home page of a version
      description: >-
        Extracted from the version's stored files on first request and
        cached: npm manifests, packument or tarball; the .nuspec and the
        README it references inside the .nupkg; PyPI core metadata; the
        Maven POM. Facts that are not found are empty.
      responses:
        "200":
          description: Package facts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
  /components/{id}/readme-images/{sig}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: sig
        in: path
        required: true
        schema: { type: string }
        description: Signature the server issued for this component and source
      - name: u
        in: query
        schema: { type: string }
        description: Remote image URL (proxy mode). Exactly one of u and p.
      - name: p
        in: query
        schema: { type: string }
        description: File inside the package archive. Exactly one of u and p.
    get:
      tags: [components]
      operationId: getReadmeImage
      summary: An image of a version's README, or its icon
      description: >-
        Serves the URLs `GET /components/{id}/info` returns in
        `readme.images` and `icon_url`; only URLs this server signed for the
        component are accepted, so this is not an open proxy. `p` names a
        file inside the .nupkg or npm tarball. `u` is a remote image the
        server fetches when `ui.readme_images` is `proxy`: through the
        outbound HTTP settings and the address policy (the URL and every
        redirect hop), https only unless `ui.readme_images_allow_http`, at
        most 5 MiB and 15 s, without cookies, credentials or referrer, and
        cached for 24 hours (failures for 15 minutes). Only content that
        sniffs as PNG, JPEG, GIF, WebP, AVIF or SVG is served, with
        `Content-Security-Policy: default-src 'none'; style-src
        'unsafe-inline'; frame-ancestors 'none'; sandbox` and
        `X-Content-Type-Options: nosniff`. Needs read access to the
        component's repository.
      responses:
        "200":
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/avif: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The URL is not signed by this server for this component (`invalid_signature`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >-
            No such component or file, remote images are not proxied
            (`not_found`), or the remote image could not be loaded or is not
            an image (`image_unavailable`; not a server error, so a broken
            third-party badge does not raise 5xx alerts)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The file is not a served image type (`not_an_image`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /assets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [components]
      operationId: getAsset
      summary: One file of a repository
      responses:
        "200":
          description: Asset detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [components]
      operationId: deleteAsset
      description: >-
        Deletes the file. Requires `repo:<name>:delete`; audited as
        `asset.delete` (refusals with outcome "denied"). The blob reference
        is released, so a blob no other asset uses becomes eligible for
        compaction. Deleting the last file of a version deletes the version.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /components/{id}/findings:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [components, security]
      operationId: listComponentFindings
      description: Unresolved findings of the component (open, assigned, waived) and its scan state.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentFindings" }
        "404": { $ref: "#/components/responses/NotFound" }
  /components/{id}:scan:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [components, security]
      operationId: scanComponent
      description: >-
        Scans the component against the advisory database now and answers
        when done. Components of formats without an advisory source (Docker
        images) are not scanned; the result says `unsupported`. Requires
        `system:security:write` or write access to the repository.
      responses:
        "200":
          description: Scan finished (also when it failed; see `scan.status`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: Scanning is turned off (`scanning.enabled`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /components/{id}/dependents:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [components]
      operationId: listComponentDependents
      x-status: planned
      description: Planned; not implemented yet (answers 501).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Components that depend on this one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedComponentPage" }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /components/{id}/sbom:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [components]
      operationId: getComponentSbom
      x-status: planned
      description: Planned; not implemented yet (answers 501).
      responses:
        "200":
          description: CycloneDX SBOM
          content:
            application/vnd.cyclonedx+json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  # ---------------------------------------------------------------- search
  /search:
    get:
      tags: [search]
      operationId: search
      parameters:
        - name: q
          in: query
          description: |
            Free text plus qualifiers: `format:npm`, `repo:npm-hosted`, `sha256:ab12`,
            `cve:CVE-2026-1234`, `unused:>90d`, `license:GPL-3.0`, `published:<2026-01-01`,
            `security:findings` (pending, clean, findings, quarantined, failed, unsupported); `cve:` also matches aliases. Each free-text word is
            a prefix match on the package coordinates.
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, -downloads, -published_at]
            default: relevance
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Results and facets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ---------------------------------------------------------------- security
  /findings:
    get:
      tags: [security]
      operationId: listFindings
      description: >-
        Findings of the components in repositories the caller can read, most
        severe first. Without `status`, fixed findings are left out. `totals`,
        `fixable`, `waived` and `components` count open findings (open or
        assigned) of the same repositories and ignore the other filters.
      parameters:
        - name: severity
          in: query
          description: One or more severities, comma-separated
          schema: { type: string, examples: ["critical,high"] }
        - name: status
          in: query
          description: One or more of open, assigned, waived, fixed, comma-separated
          schema: { type: string, examples: ["waived"] }
        - name: fix_available
          in: query
          schema: { type: boolean }
        - name: in_production_days
          in: query
          description: Only components pulled in the last N days
          schema: { type: integer, minimum: 1, maximum: 3650 }
        - name: repository
          in: query
          description: Exact repository name
          schema: { type: string }
        - name: q
          in: query
          description: Matches the advisory id, an alias (CVE), the package or the title
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Findings with severity totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingList" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /findings/trend:
    get:
      tags: [security]
      operationId: getFindingTrend
      description: >-
        One point per day (UTC), oldest first, built from the stored
        findings: active findings (first seen and not yet fixed) by severity
        at the end of the day, plus findings first seen and fixed that day.
        Findings of deleted components are not counted.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - name: repository
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Daily points
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingTrend" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /findings/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [security]
      operationId: getFinding
      responses:
        "200":
          description: The finding with the advisory text and references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "404": { $ref: "#/components/responses/NotFound" }
  /findings/{id}/waiver:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [security]
      operationId: waiveFinding
      description: >-
        Accepts the risk of a finding until a date. Requires
        `system:security:write`; audited as `finding.waive`. A waived finding
        no longer counts as open and no longer quarantines its component. At
        the expiry the finding is re-opened (audited as
        `finding.waiver_expired`) and the quarantine policy applies again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaiverInput" }
      responses:
        "200":
          description: Waived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [security]
      operationId: revokeWaiver
      description: Re-opens a waived finding. Requires `system:security:write`; audited as `finding.waiver_revoke`.
      responses:
        "200":
          description: Waiver removed (or there was none)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /findings/{id}/pullers:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [security]
      operationId: getFindingPullers
      description: >-
        Who downloaded the finding's package version in the window, busiest
        first (at most 10): the principal for authenticated pulls, otherwise
        the client address and client kind from the user agent. Needs a
        readable finding and `system:security:read` or `:write`. Pulls are
        kept 90 days; `pulls_since` is the first day recorded.
      parameters:
        - $ref: "#/components/parameters/PullWindow"
      responses:
        "200":
          description: Clients by pulls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pullers" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /findings/{id}/assignee:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [security]
      operationId: assignFinding
      description: >-
        Makes an active Hangar user responsible for the finding. Requires
        `system:security:write`; audited as `finding.assign`. No
        notification is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssigneeInput" }
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [security]
      operationId: unassignFinding
      description: Removes the assignee. Requires `system:security:write`; audited as `finding.unassign`.
      responses:
        "200":
          description: Unassigned (or there was no assignee)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /scanning/status:
    get:
      tags: [security]
      operationId: getScanningStatus
      summary: Scanner configuration and scan coverage of the readable repositories
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanningStatus" }

  /vulnerabilities/fix-plan:
    get:
      tags: [security]
      operationId: getFixPlan
      description: >-
        The unresolved findings of the readable repositories grouped by
        package (format and package name): the vulnerable versions present,
        the lowest upgrade per release line that fixes every finding with a
        fix, and the downloads of the vulnerable versions in the pull window
        with the number of distinct clients. A package is `in_use` when one
        of its vulnerable versions was downloaded within `scanning.in_use_window`
        (30 days by default). Tabs: `in_use` (default; in-use packages first),
        `all` (by severity), `waived` (packages with waived findings). The
        summary covers the open findings and ignores the tab. With
        `format=csv` or `Accept: text/csv` the packages are returned as a CSV
        file.
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [in_use, all, waived], default: in_use }
        - $ref: "#/components/parameters/PullWindow"
        - name: assignee
          in: query
          description: Only findings assigned to this user; `me` is the caller
          schema: { type: string, examples: ["me"] }
        - name: repository
          in: query
          description: Exact repository name
          schema: { type: string }
        - name: q
          in: query
          description: Matches the package, the advisory id, an alias (CVE) or the title
          schema: { type: string }
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        "200":
          description: The fix plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixPlan" }
            text/csv:
              schema:
                type: string
                description: >-
                  Header package, format, repositories, advisories,
                  vulnerable_versions, findings, max_severity, max_cvss,
                  upgrade_to, upgrade_commands, pulls_<window>,
                  clients_<window>, in_use, assignee, status
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /vulnerabilities/fix-plan/assign:
    post:
      tags: [security]
      operationId: assignPackage
      description: >-
        Sets (or with a null or empty assignee removes) the assignee of every
        unresolved finding of a package in the readable repositories. New
        findings of an assigned package get the same assignee. Requires
        `system:security:write`; audited once as `finding.assign` or
        `finding.unassign` with target `package:<format>/<package>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageAssignInput" }
      responses:
        "200":
          description: The findings changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /vulnerabilities/fix-plan/waive:
    post:
      tags: [security]
      operationId: waivePackage
      description: >-
        Waives the listed findings of a package, or all of its unresolved
        findings when `finding_ids` is empty, with one reason and end date.
        Requires `system:security:write`; each finding is audited as
        `finding.waive`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageWaiverInput" }
      responses:
        "200":
          description: The findings waived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /vulnerabilities/assignees:
    get:
      tags: [security]
      operationId: listAssignees
      description: Active users findings can be assigned to. Requires `system:security:write`.
      parameters:
        - name: q
          in: query
          description: Matches the username, display name or email
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Assignee" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /vulnerabilities/rescan:
    get:
      tags: [security]
      operationId: getRescan
      description: The last "rescan every repository" and its progress. Requires `system:security:read` or `:write`.
      responses:
        "200":
          description: The last run, or null
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run:
                    oneOf:
                      - $ref: "#/components/schemas/Rescan"
                      - type: "null"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [security]
      operationId: startRescan
      description: >-
        Queues a scan of every repository of a scanned format (one
        repository scan job each). While a run is in progress it is returned
        instead (200). Requires `system:security:write`; audited as
        `vulnerability.rescan`.
      responses:
        "200":
          description: A run is already in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RescanStarted" }
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RescanStarted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { description: Scanning is turned off or not available }

  # ---------------------------------------------------------------- cleanup
  /cleanup-policies:
    get:
      tags: [cleanup]
      operationId: listCleanupPolicies
      description: Requires `system:cleanup:read`. Every endpoint that changes something, and preview, requires `system:cleanup:write`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Policies by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupPolicyPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [cleanup]
      operationId: createCleanupPolicy
      description: |
        Rejected with 400 `preview_required` unless the same name, format,
        criteria and repositories were previewed within the last hour
        (`preview_token`). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CleanupPolicyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /cleanup-policies/preview:
    post:
      tags: [cleanup]
      operationId: previewCleanupPolicy
      summary: Dry run of (possibly unsaved) criteria
      description: |
        Lists exactly what a run would delete now, with sizes, and issues a
        `preview_token` for saving these rules. With `Accept: text/csv` or
        `?format=csv` every candidate is streamed as CSV instead (columns
        repository, format, namespace, name, version, size_bytes, created_at,
        last_downloaded_at, download_count, id).
      parameters:
        - name: sample
          in: query
          description: Number of candidates in `sample` (default 100)
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: format
          in: query
          schema: { type: string, enum: [csv] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CleanupPolicyInput" }
      responses:
        "200":
          description: What would be deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupPreview" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /cleanup-policies/{name}:
    parameters:
      - $ref: "#/components/parameters/CleanupPolicyRef"
    get:
      tags: [cleanup]
      operationId: getCleanupPolicy
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupPolicy" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [cleanup]
      operationId: updateCleanupPolicy
      description: |
        Replaces the policy. The name cannot change. A new `preview_token` is
        required when the format, criteria or repositories change; schedule,
        description and `enabled` can change without one. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CleanupPolicyInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cleanup]
      operationId: deleteCleanupPolicy
      description: Deletes the policy with its task and run history. A running policy must be stopped first.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_running`: stop the run first"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /cleanup-policies/{name}/run:
    parameters:
      - $ref: "#/components/parameters/CleanupPolicyRef"
    post:
      tags: [cleanup]
      operationId: runCleanupPolicy
      summary: Run the policy now (also when disabled; disabling only stops the schedule)
      responses:
        "202":
          description: Run queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRun" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_running`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /cleanup-policies/{name}/stop:
    parameters:
      - $ref: "#/components/parameters/CleanupPolicyRef"
    post:
      tags: [cleanup]
      operationId: stopCleanupPolicy
      responses:
        "202":
          description: Cancellation requested (a queued run is cancelled at once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRun" }
        "409":
          description: "`not_running`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /cleanup-policies/{name}/runs:
    parameters:
      - $ref: "#/components/parameters/CleanupPolicyRef"
    get:
      tags: [cleanup]
      operationId: listCleanupPolicyRuns
      summary: Run history, newest first (`result` holds a CleanupRunResult)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRunPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- tasks
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      description: |
        Built-in maintenance tasks, the tasks of cleanup policies and tasks
        added by administrators, with their last run, plus the active runs.
        Requires `system:tasks:read`; every task endpoint that changes
        something requires `system:tasks:write` and is audited.
      responses:
        "200":
          description: Scheduled tasks and the runs in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tasks]
      operationId: createTask
      description: Adds a task of a creatable type (`blob_compaction`, `docker_gc`). Cleanup tasks belong to cleanup policies.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskRef"
    get:
      tags: [tasks]
      operationId: getTask
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [tasks]
      operationId: updateTask
      description: |
        Changes description, schedule, config and `enabled`; name and type are
        fixed. Built-in tasks can be edited (not deleted). Tasks of cleanup
        policies answer 409 `managed`: edit the policy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`managed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [tasks]
      operationId: deleteTask
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`managed` (built in or a cleanup policy's task) or `already_running`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /tasks/{id}/run:
    parameters:
      - $ref: "#/components/parameters/TaskRef"
    post:
      tags: [tasks]
      operationId: runTask
      responses:
        "202":
          description: Run queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRun" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_running`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /tasks/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/TaskRef"
    post:
      tags: [tasks]
      operationId: stopTask
      description: A queued run is cancelled at once; a running one stops within a few seconds and ends as `cancelled`.
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRun" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_running`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /tasks/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/TaskRef"
    get:
      tags: [tasks]
      operationId: listTaskRuns
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRunPage" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tasks/{id}/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/TaskRef"
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [tasks]
      operationId: getTaskRun
      summary: One run with its result
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tasks/{id}/runs/{run_id}/log:
    parameters:
      - $ref: "#/components/parameters/TaskRef"
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [tasks]
      operationId: getTaskRunLog
      summary: Log lines of a run, oldest first
      description: |
        Poll with `after` set to the last `seq` seen to follow a running run.
        The server keeps the newest 256 KiB of a run's log; `truncated` is set
        when older lines were dropped.
      parameters:
        - name: after
          in: query
          description: Only lines with a greater `seq`
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        "200":
          description: Log lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRunLog" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- access
  /lockfiles:
    post:
      tags: [tasks]
      operationId: parseLockfile
      summary: Read the coordinates a lockfile pins (for a pre-warm task)
      description: |
        Reads a lockfile, or a plain list with one coordinate per line, into
        the coordinates of `repository`'s format. The parser is chosen by
        `filename`: npm `package-lock.json`, `npm-shrinkwrap.json`,
        `pnpm-lock.yaml`, `yarn.lock` (v1 and berry); NuGet
        `packages.lock.json`; PyPI `requirements*.txt` (pinned `==` lines),
        `uv.lock`, `poetry.lock`; Go `go.sum`; Cargo `Cargo.lock`; Maven
        `gradle.lockfile`; Helm `Chart.lock`; anything else is a plain list.
        Dependencies no registry serves (workspace, path, git, link) are
        counted as skipped. Send the body gzip-compressed
        (`Content-Encoding: gzip`) when it is larger than the API body limit;
        up to 32 MiB uncompressed. Nothing is stored. Needs `system:tasks:write`.
      parameters:
        - { name: repository, in: query, required: true, schema: { type: string }, description: The proxy or group repository to pre-warm (selects the format) }
        - { name: filename, in: query, required: true, schema: { type: string }, description: The lockfile's file name }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: Coordinates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockfileResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users:
    get:
      tags: [access]
      operationId: listUsers
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [user, service_account] }
        - name: role
          in: query
          description: Only users holding this role directly
          schema: { type: string }
        - name: status
          in: query
          description: "`active` = enabled and not locked"
          schema: { type: string, enum: [active, disabled, locked] }
        - name: source
          in: query
          schema: { type: string, enum: [local, oidc, ldap, saml] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Members (Members and Service accounts tabs)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberPage" }
    post:
      tags: [access]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [access]
      operationId: getUser
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [access]
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
    delete:
      tags: [access]
      operationId: deleteUser
      description: Deletes the user with their tokens, sessions and role bindings. You cannot delete yourself or the last enabled administrator.
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/unlock:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [access]
      operationId: unlockUser
      summary: Clear a lockout after failed sign-ins
      responses:
        "200":
          description: Unlocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [access]
      operationId: disableUser
      summary: Disable an account
      description: Ends the account's sessions; its tokens stop working until it is enabled again. You cannot disable yourself or the last enabled administrator.
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [access]
      operationId: enableUser
      summary: Enable a disabled account
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [access]
      operationId: resetUserPassword
      summary: Set another local user's password
      description: Clears any lockout and ends all of the user's sessions. Change your own password with `PUT /me/password`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordReset" }
      responses:
        "204": { description: Password set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/require-password-change:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [access]
      operationId: requireUserPasswordChange
      summary: Make a local user set a new password before anything else
      description: |
        Needs `system:users:write`. From the user's next request on, their
        sessions and password sign-ins are limited to changing the password
        (see `password_change_required`); their access tokens keep working.
        Local users with a password only; not yourself. Audited as
        `user.password.require_change`. Repeating it changes nothing.
      responses:
        "200":
          description: The user, with `must_change_password` set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/permissions:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [access]
      operationId: getUserPermissions
      summary: Effective permissions of a user, and why
      description: |
        For every repository and system area the user can act on: the allowed
        actions and each grant behind them (role and privilege, or the
        repository's anonymous read). Needs `system:users:read`, or the user
        themself.
      responses:
        "200":
          description: Effective permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectivePermissions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [access]
      operationId: listUserSessions
      summary: A user's active browser sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfoList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [access]
      operationId: revokeUserSessions
      summary: End every session of a user
      description: Also revokes the user's short-lived session tokens. When the user is the caller, the current session is kept.
      responses:
        "200":
          description: Sessions ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionsEnded" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/sessions/{sid}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [access]
      operationId: revokeUserSession
      summary: End one session of a user
      responses:
        "204": { description: Ended }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /roles:
    get:
      tags: [access]
      operationId: listRoles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
    post:
      tags: [access]
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
  /roles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [access]
      operationId: getRole
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [access]
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "409":
          description: Built-in roles cannot be changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [access]
      operationId: deleteRole
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Built-in roles cannot be deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /roles/{name}/members:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [access]
      operationId: addRoleMember
      summary: Grant the role to a user (no-op if they have it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleMemberInput" }
      responses:
        "204": { description: Granted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /roles/{name}/members/{id}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [access]
      operationId: removeRoleMember
      summary: Take the role away from a user
      description: The last enabled administrator keeps the Admin role.
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /identity-providers:
    get:
      tags: [access]
      operationId: listIdentityProviders
      summary: Sign-in providers and their status
      description: |
        The OIDC and LDAP providers (`system:users:read`). `oidc` is in `error`
        while discovery fails; `ldap` reports the outcome of the most recent
        directory request in `last_sync_at` and `error`.
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/IdentityProvider" }
  /identity-providers/oidc:
    get:
      tags: [settings]
      operationId: getOidcSettings
      summary: OIDC sign-in settings
      description: |
        `system:settings:read`. When `auth.oidc` is enabled in the configuration
        file, the file's settings are returned with `source: file` and every
        field in `file_fields` (read-only). The client secret is never returned.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCProviderSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [settings]
      operationId: putOidcSettings
      summary: Save the OIDC sign-in settings
      description: |
        `system:settings:admin`. Replaces every field and applies the result on
        every node without a restart. An empty `client_secret` keeps the stored
        secret; `clear_client_secret: true` removes it. Field problems answer 400
        with `details.fields` (e.g. `issuer_url`, `group_roles[1].roles`). A
        provider set in the configuration file answers 400. Audited as
        `settings.oidc.update` with the names of the changed fields.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OIDCSettingsInput" }
      responses:
        "200":
          description: Saved and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCProviderSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /identity-providers/oidc:test:
    post:
      tags: [settings]
      operationId: testOidcSettings
      summary: Test OIDC settings
      description: |
        `system:settings:admin`. Fetches the discovery document, checks the
        issuer and the signing keys, and tries a `client_credentials` grant to
        check the client secret. Providers that do not allow that grant report
        "Discovery ok, credentials are verified at first sign-in". Without
        `settings` the settings in effect are tested; with them, the form values
        (an empty secret uses the stored one).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                settings: { $ref: "#/components/schemas/OIDCSettingsInput" }
      responses:
        "200":
          description: Outcome (also when the test failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /identity-providers/ldap:
    get:
      tags: [settings]
      operationId: getLdapSettings
      summary: LDAP sign-in settings
      description: Like `GET /identity-providers/oidc`; the bind password is never returned.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LDAPProviderSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [settings]
      operationId: putLdapSettings
      summary: Save the LDAP sign-in settings
      description: |
        Like `PUT /identity-providers/oidc`. An empty `bind_password` keeps the
        stored one; `clear_bind_password: true` removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LDAPSettingsInput" }
      responses:
        "200":
          description: Saved and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LDAPProviderSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /identity-providers/ldap:test:
    post:
      tags: [settings]
      operationId: testLdapSettings
      summary: Test LDAP settings
      description: |
        `system:settings:admin`. Connects (with StartTLS when set), binds as the
        service account and, with `username`, looks that user and their groups
        up and shows the roles the mapping grants. No user password is needed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                settings: { $ref: "#/components/schemas/LDAPSettingsInput" }
                username: { type: string }
      responses:
        "200":
          description: Outcome (also when the test failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /proxies:
    get:
      tags: [settings]
      operationId: listProxies
      summary: Outbound proxies
      description: |
        Every signed-in user may list proxies (the repository proxy picker);
        without `system:settings:read` items carry only `name`, `source` and
        `default`, and `limited` is true. The proxy `http.proxy` defines in the
        configuration file is listed as `config` with `source: file`; it is then
        the platform default.
      responses:
        "200":
          description: Proxies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundProxyList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [settings]
      operationId: createProxy
      summary: Create an outbound proxy
      description: |
        `system:settings:admin`. `default: true` makes it the platform default
        and clears the flag elsewhere. Audited as `proxy.create` (without the
        password).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutboundProxyInput" }
      responses:
        "201":
          description: Created and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundProxy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /proxies/{name}:
    parameters:
      - $ref: "#/components/parameters/ProxyName"
    get:
      tags: [settings]
      operationId: getProxy
      summary: One outbound proxy
      responses:
        "200":
          description: Proxy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundProxy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [settings]
      operationId: updateProxy
      summary: Change an outbound proxy
      description: |
        `system:settings:admin`. The name cannot change. An empty `password`
        keeps the stored one; `clear_password: true` removes it. Proxies set in
        the configuration file answer 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutboundProxyInput" }
      responses:
        "200":
          description: Saved and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundProxy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [settings]
      operationId: deleteProxy
      summary: Delete an outbound proxy
      description: |
        `system:settings:admin`. Refused with 409 `in_use` while proxy
        repositories select it by name (`details.repositories`, `details.total`).
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /proxies/{name}:test:
    parameters:
      - $ref: "#/components/parameters/ProxyName"
    post:
      tags: [settings]
      operationId: testProxy
      summary: Fetch a URL through a proxy
      description: |
        `system:settings:admin`. GETs `url` (default
        `https://api.nuget.org/v3/index.json`) through the proxy and reports the
        HTTP status and latency. With `settings`, unsaved form values are tested
        (the proxy need not exist yet; an empty password uses the stored one).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                settings: { $ref: "#/components/schemas/OutboundProxyInput" }
      responses:
        "200":
          description: Outcome (also when the request failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tokens:
    get:
      tags: [access]
      operationId: listTokens
      description: |
        The caller's live (not revoked) tokens, newest first, expired ones included.
        With `system:tokens:read`, `owner` selects another principal and `all=true`
        lists everyone's.
      parameters:
        - name: owner
          in: query
          schema: { type: string }
        - name: all
          in: query
          description: Every owner's tokens (needs `system:tokens:read`)
          schema: { type: boolean }
        - name: owner_kind
          in: query
          schema: { type: string, enum: [user, service_account] }
        - name: status
          in: query
          schema: { type: string, enum: [active, expired] }
        - name: q
          in: query
          description: Substring of the token name
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tokens (secrets are never returned)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [access]
      operationId: createToken
      description: |
        A personal access token for the caller, or (with `system:tokens:write`)
        a token for the service account named in `owner`. A token never grants
        more than its owner's roles: requests need both a role privilege and a
        matching scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenInput" }
      responses:
        "201":
          description: Created; `secret` is shown only in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [access]
      operationId: revokeToken
      description: Your own tokens, or anyone's with `system:tokens:delete`. Tokens minted from it stop working too.
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /tokens/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [access]
      operationId: rotateToken
      summary: Replace a token by a new one with the same scopes
      description: |
        Creates a token with the same name, owner, scopes, restrictions and
        lifetime (capped at the server maximum) and returns its secret once.
        The old token keeps working unless `revoke_old_after` is set: `0s`
        revokes it at once, a longer duration ends it that much later (never
        later than it would have expired). Your own tokens, or a service
        account's with `system:tokens:write` (and `system:tokens:delete` to end
        the old one). Audited as `token.rotate`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRotateInput" }
      responses:
        "201":
          description: The replacement; `secret` is shown only in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenRotated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- audit
  /audit:
    get:
      tags: [audit]
      operationId: listAuditEvents
      parameters:
        - name: actor
          in: query
          schema: { type: string }
        - name: action
          in: query
          description: Exact action or prefix with `*` (`repository.*`)
          schema: { type: string }
        - name: target
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /audit/export:
    get:
      tags: [audit]
      operationId: exportAuditEvents
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, json] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Streamed export
          content:
            text/csv:
              schema: { type: string }
            application/x-ndjson:
              schema: { type: string }

  # ---------------------------------------------------------------- cluster
  /nodes:
    get:
      tags: [cluster]
      operationId: listNodes
      description: |
        Nodes from the heartbeats behind /system/nodes, in the cluster summary
        shape. `quorum` means more than half of the known nodes are up.
        Requires `system:cluster:read`.
      responses:
        "200":
          description: Cluster members and dependency health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterStatus" }
  /replication/targets:
    get:
      tags: [cluster]
      operationId: listReplicationTargets
      x-status: planned
      description: Planned (edge replication); not implemented yet (answers 501).
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReplicationTarget" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      tags: [cluster]
      operationId: createReplicationTarget
      x-status: planned
      description: Planned (edge replication); not implemented yet (answers 501).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplicationTargetInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationTarget" }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /replication/targets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [cluster]
      operationId: deleteReplicationTarget
      x-status: planned
      description: Planned (edge replication); not implemented yet (answers 501).
      responses:
        "204": { description: Deleted }
        "501": { $ref: "#/components/responses/NotImplemented" }

  # ---------------------------------------------------------------- events
  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Server-Sent Events stream
      description: |
        `text/event-stream`. Each message has `event: <type>` and `data: <JSON>`
        where the JSON is the `data` member of the matching `LiveEvent` variant.
        A comment line (`: ping`) is sent every 15 s. Events the caller may not
        read (RBAC) are filtered out. Reconnect with `Last-Event-ID` to resume
        within the server's short replay window.
      parameters:
        - name: types
          in: query
          description: Comma-separated event types to receive (default all)
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/LiveEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Event bus unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hangar_session
    bearerToken:
      type: http
      scheme: bearer
      description: Personal access or service-account token (`hgr_...`)
    basicAuth:
      type: http
      scheme: basic
      description: Username plus a token as the password (CLI clients)

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `next_cursor`
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sid
      in: path
      required: true
      schema: { type: string }
    PullWindow:
      name: window
      in: query
      description: Pull window in days, e.g. 7d (1d..90d)
      schema: { type: string, default: 7d, pattern: "^[0-9]{1,3}d?$" }
    RepositoryName:
      name: name
      in: path
      required: true
      schema: { $ref: "#/components/schemas/RepositoryName" }
    CleanupPolicyRef:
      name: name
      in: path
      required: true
      description: Policy name or id
      schema: { type: string }
    TaskRef:
      name: id
      in: path
      required: true
      description: Task id or name (tasks of cleanup policies are named `cleanup/<policy>`, URL-encoded)
      schema: { type: string }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string }
    ProxyName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in, or credentials invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Missing privilege, or (code `password_change_required`) the password must be changed first
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Name already taken or state conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotImplemented:
      description: Planned, not implemented by this server yet (code `not_implemented`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ------------------------------------------------------------ common
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Machine-readable code, e.g. `invalid_argument` (400), `unauthenticated` (401),
            `forbidden`, `read_only_token` or `password_change_required` (403),
            `not_found` (404), `conflict` (409), `locked` (423), `rate_limited` (429),
            `internal` (500), `not_implemented` (501)
        message: { type: string }
        retry_after:
          type: integer
          description: Seconds until the action may be retried (lockout, rate limit)
        details:
          type: object
          additionalProperties: true
    NextCursor:
      type: [string, "null"]
      description: Cursor for the next page; null or absent on the last page
    Format:
      type: string
      enum: [docker, npm, maven, pypi, go, helm, nuget, cargo, apt, rpm, raw]
    SigningKey:
      type: object
      required: [repository, key, algorithm, fingerprint, key_id, public_key]
      properties:
        repository: { type: string }
        key: { type: string, enum: [repository, shared], description: The repository's own key or the server-wide shared key (format setting signing_key) }
        algorithm: { type: string, examples: [rsa4096, ed25519] }
        fingerprint: { type: string, description: Upper-case hex fingerprint }
        key_id: { type: string, description: Long key id }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        public_key: { type: string, description: ASCII-armored public key }
    FormatInfo:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/Format" }
    RepositoryType:
      type: string
      enum: [hosted, proxy, group]
    RepositoryName:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
    Duration:
      type: string
      description: Go duration string
      examples: ["24h0m0s", "90s"]
    Bytes:
      type: integer
      format: int64
      minimum: 0
    Timestamp:
      type: string
      format: date-time
    Severity:
      type: string
      enum: [critical, high, medium, low, unknown]
    BuildInfo:
      type: object
      required: [version, go_version]
      properties:
        version: { type: string }
        commit: { type: string }
        date: { type: string }
        go_version: { type: string }

    # ------------------------------------------------------------ auth/system
    AuthProviders:
      type: object
      required: [oidc, ldap, saml, local]
      properties:
        oidc:
          description: |
            OIDC provider for "Continue with ..."; null when not configured.
            `start_url` is `/api/v1/auth/oidc/start`; append `?redirect=<path>` to
            return to a page after sign-in.
          oneOf:
            - type: "null"
            - type: object
              required: [display_name, start_url]
              properties:
                display_name: { type: string }
                start_url: { type: string }
        ldap:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
        saml:
          type: object
          description: SAML sign-in is planned; this server always reports it disabled.
          required: [enabled, start_url]
          properties:
            enabled: { type: boolean }
            start_url: { type: [string, "null"] }
        local:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
    LoginRequest:
      type: object
      required: [username, password, remember, realm]
      properties:
        username: { type: string }
        password: { type: string, format: password, writeOnly: true }
        remember: { type: boolean }
        realm: { type: string, enum: [local, ldap] }
    User:
      type: object
      required: [id, username, display_name, email]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        kind: { type: string, enum: [user, service_account] }
        source:
          type: string
          description: Where the identity lives; only `local` users have a password to change here
          enum: [local, oidc, ldap, saml]
        roles:
          type: array
          description: Roles bound directly to the user
          items: { type: string }
    Organization:
      type: object
      required: [slug, name, environment, region]
      properties:
        slug: { type: string }
        name: { type: string }
        environment: { type: string }
        region: { type: string }
    Session:
      type: object
      required: [user, organization]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }
        privileges:
          type: array
          description: Effective privileges, so the UI can hide actions the user cannot take
          items: { $ref: "#/components/schemas/Privilege" }
        auth_method:
          type: string
          description: How this request authenticated
          enum: [session, token, basic]
        token_policy: { $ref: "#/components/schemas/TokenPolicy" }
        token_warnings:
          type: array
          description: |
            Live tokens expiring within `token_policy.expiry_warning`, soonest first:
            the caller's own and, with `system:tokens:read`, service accounts' tokens.
          items: { $ref: "#/components/schemas/Token" }
        password_change_required:
          type: boolean
          description: |
            The user signed in with a password they must replace (first sign-in,
            one-time password, administrator request). Until `PUT /me/password`
            succeeds only `GET /auth/session`, `PUT /me/password` and
            `POST /auth/logout` answer; `privileges` is empty.
        password_policy: { $ref: "#/components/schemas/PasswordPolicy" }
        token:
          description: The token this request authenticated with; absent for browser sessions and passwords
          allOf: [{ $ref: "#/components/schemas/CurrentToken" }]
    PasswordPolicy:
      type: object
      description: Rules new local passwords must meet (`auth.password`)
      required: [min_length, max_length, min_classes, allow_username]
      properties:
        min_length: { type: integer, description: Minimum length in characters }
        max_length: { type: integer, description: Maximum length in characters }
        min_classes:
          type: integer
          description: How many of lower case, upper case, digits and symbols must appear (0 = no rule)
        allow_username:
          type: boolean
          description: Whether the password may contain the username
    CurrentToken:
      type: object
      required: [id, kind, name, prefix, scopes, expires_at, read_only, allowed_cidrs]
      properties:
        id: { type: string }
        kind:
          type: string
          description: "`personal` (personal access and service-account tokens) or `session` (short-lived registry logins)"
          enum: [personal, session]
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: [array, "null"]
          description: Effective scopes (narrowed to read for read-only tokens); null means the owner's full rights
          items: { $ref: "#/components/schemas/Privilege" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        read_only: { type: boolean }
        allowed_cidrs:
          type: array
          description: Client networks the token works from; empty means any
          items: { type: string }
    TokenPolicy:
      type: object
      required: [max_lifetime, max_lifetime_days, expiry_warning]
      properties:
        max_lifetime: { $ref: "#/components/schemas/Duration" }
        max_lifetime_days:
          type: integer
          description: "`max_lifetime` in whole days, for expiry pickers"
        expiry_warning: { $ref: "#/components/schemas/Duration" }
    ClientEndpoint:
      type: object
      required: [format, endpoint, repository]
      properties:
        format: { $ref: "#/components/schemas/Format" }
        endpoint:
          type: string
          description: Registry host for docker, base URL for everything else (built from server.base_url)
        repository: { type: string }
    ClientEndpointPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ClientEndpoint" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    DependencyStatus:
      type: object
      required: [name, status, latency_ms]
      properties:
        name:
          type: string
          description: database, blobstore, eventbus, search, scanner
        status: { type: string, enum: [ok, fail] }
        latency_ms: { type: integer }
        error: { type: string }
    SystemStatus:
      type: object
      required: [state, message, version, instance_name, nodes_up, nodes_total]
      properties:
        state:
          type: string
          enum: [ok, degraded, down]
          description: ok = all normal; degraded = something needs attention; down = outage
        message:
          type: string
          description: Short sentence, e.g. "All systems normal"
        version: { type: string }
        instance_name: { type: string }
        base_url:
          type: string
          description: server.base_url, the externally visible URL clients are configured with (empty if unset)
        registry_host:
          type: string
          description: host[:port] docker clients use, from server.base_url (repositories with a connector use their own)
        nodes_up: { type: integer }
        nodes_total: { type: integer }
        build: { $ref: "#/components/schemas/BuildInfo" }
        uptime_seconds: { type: integer }
        web_ui:
          type: boolean
          description: Whether the web UI is embedded in this binary
        dependencies:
          type: array
          description: The answering node's checks; `error` only for system:cluster:read
          items: { $ref: "#/components/schemas/DependencyStatus" }
        checks_total: { type: integer, description: System status checks of the nodes that answer }
        checks_passing: { type: integer, description: Of those, the healthy ones }
        problems:
          type: array
          description: Checks that are not healthy and silent nodes, worst first; signed-in callers only
          items: { $ref: "#/components/schemas/SystemCheckState" }

    SystemCheckState:
      type: object
      required: [name, label, status]
      properties:
        node: { type: string, description: The node the check ran on; set when there is more than one }
        name:
          type: string
          description: The subsystem name (see SystemSubsystem), or `node` for a node that stopped publishing heartbeats
        label: { type: string }
        status: { $ref: "#/components/schemas/SystemStatusLevel" }
        detail: { type: string, description: "One sentence explaining the status; only for system:cluster:read on /system/status" }
        since: { $ref: "#/components/schemas/Timestamp" }
        latency_ms: { type: integer }
    SystemSummary:
      type: object
      required: [status, headline, nodes_up, nodes_total, checks_total, checks_passing, problems]
      description: The installation's state as /system/status reports it
      properties:
        status: { $ref: "#/components/schemas/SystemStatusLevel" }
        headline: { type: string, examples: ["All systems normal", "Blob storage down", "2 checks need attention"] }
        nodes_up: { type: integer }
        nodes_total: { type: integer }
        checks_total: { type: integer }
        checks_passing: { type: integer }
        problems:
          type: array
          items: { $ref: "#/components/schemas/SystemCheckState" }

    SystemStatusLevel:
      type: string
      enum: [healthy, degraded, down]
    SystemSubsystem:
      type: object
      required: [name, label, status, detail, checked_at]
      properties:
        name:
          type: string
          description: database, blobstores, eventbus, scheduler, search, auth, upstreams, scanner
        label: { type: string, description: "Display name, e.g. Database or Sign-in (OIDC)" }
        status: { $ref: "#/components/schemas/SystemStatusLevel" }
        detail: { type: string, description: One sentence explaining the status }
        checked_at: { $ref: "#/components/schemas/Timestamp" }
        latency_ms: { type: integer }
        metric:
          type: string
          description: The check's one headline value, e.g. "2 ms", "22% free", "leader"
        target:
          type: string
          description: What the check probes, without credentials (database address, blob store path, event bus URL, index name)
        since:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: When this node first saw the current status; at the earliest, its first check after start
        last_incident:
          type: object
          description: The most recent finished period in which this node saw the subsystem not healthy. Kept in memory; a restart forgets it.
          required: [status, detail, started_at, ended_at]
          properties:
            status: { $ref: "#/components/schemas/SystemStatusLevel" }
            detail: { type: string, description: Explanation at the worst point of the period }
            started_at: { $ref: "#/components/schemas/Timestamp" }
            ended_at: { $ref: "#/components/schemas/Timestamp" }
        facts:
          type: array
          description: Labelled values in display order (pool usage, free space, ...)
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
    SystemNode:
      type: object
      required: [id, hostname, url, version, commit, started_at, uptime_seconds, last_heartbeat, role, status, stale, current, subsystems]
      properties:
        id: { type: string, description: "server.node_id, default the host name" }
        hostname: { type: string }
        url: { type: string, description: Address of this node itself (not the load balancer) }
        version: { type: string }
        commit: { type: string }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        uptime_seconds: { type: integer }
        last_heartbeat: { $ref: "#/components/schemas/Timestamp" }
        role:
          type: string
          enum: [leader, follower]
          description: Scheduler role; the leader schedules tasks, every node executes them
        status:
          $ref: "#/components/schemas/SystemStatusLevel"
        stale:
          type: boolean
          description: No heartbeat for three intervals; status is down
        current:
          type: boolean
          description: The node that answered this request
        subsystems:
          type: array
          items: { $ref: "#/components/schemas/SystemSubsystem" }
    SystemNodeList:
      type: object
      required: [current, generated_at, items, partial]
      properties:
        current: { type: string, description: Id of the node that answered }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        items:
          type: array
          items: { $ref: "#/components/schemas/SystemNode" }
        partial:
          type: boolean
          description: Only this node is listed because the database cannot be read
        message: { type: string }
        summary: { $ref: "#/components/schemas/SystemSummary" }
    SystemLogRecord:
      type: object
      required: [seq, time, level, msg]
      properties:
        seq: { type: integer, description: Sequence number within the node's process }
        time: { $ref: "#/components/schemas/Timestamp" }
        level: { type: string, enum: [debug, info, warn, error] }
        msg: { type: string }
        attrs:
          type: object
          additionalProperties: true
          description: Structured attributes (request_id, trace_id, principal, repository, error, ...); credentials are replaced by REDACTED
    SystemLogPage:
      type: object
      required: [node, items, cursor, more, gap, buffer]
      properties:
        node: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/SystemLogRecord" }
        cursor:
          type: string
          description: Pass back to get only newer records
        more:
          type: boolean
          description: The limit cut this page short; ask again at once with `cursor`
        gap:
          type: boolean
          description: Records after the cursor were overwritten before they were read, or the node restarted
        buffer:
          type: object
          required: [size, capacity, oldest_seq]
          properties:
            size: { type: integer }
            capacity: { type: integer }
            oldest_seq: { type: integer }

    # ------------------------------------------------------------ overview
    OverviewRange:
      type: string
      enum: [1h, today, 7d, 30d]
      default: today
    TrafficBucket:
      type: object
      required: [start, downloads, uploads, requests]
      properties:
        start: { $ref: "#/components/schemas/Timestamp" }
        downloads:
          type: [integer, "null"]
          description: Content downloads served by every node; null for buckets that ended before traffic recording started, or without traffic statistics
        uploads:
          type: integer
          description: Components published to hosted repositories in the bucket (proxy cache fills are not counted)
        requests:
          type: [integer, "null"]
          description: Requests served by every node in the bucket (as in `requests.total`); null like `downloads`
    OverviewMetrics:
      type: object
      required: [range, generated_at, summary, activity, storage, requests, cache, issues, traffic, storage_by_format]
      properties:
        range: { $ref: "#/components/schemas/OverviewRange" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        summary:
          type: object
          required: [published_since_yesterday, failed_pushes]
          properties:
            published_since_yesterday:
              type: integer
              description: Components published to hosted repositories in the last 24 hours
            failed_pushes: { type: integer }
        activity:
          type: object
          description: What happened to the catalog over the range (from the range start to now)
          required: [published, cached, pushes_rejected]
          properties:
            published:
              type: integer
              description: Components published to hosted repositories
            cached:
              type: integer
              description: Components fetched from a remote into proxy repositories
            pushes_rejected:
              type: integer
              description: Publish attempts that failed or were denied (component.publish audit records with outcome error or denied)
        storage:
          type: object
          required: [used_bytes, capacity_bytes, added_bytes_24h]
          properties:
            used_bytes: { $ref: "#/components/schemas/Bytes" }
            capacity_bytes:
              type: [integer, "null"]
              description: Sum of the blob stores' soft quotas; null unless every store has one
            added_bytes_24h: { $ref: "#/components/schemas/Bytes" }
        requests:
          type: object
          description: |
            Requests served by every node (probes, /metrics and the event
            stream excluded). Each node adds its counters to per-minute rows in
            the database, so the numbers survive restarts; whole minutes are
            counted. Every value is null when traffic statistics are not
            available.
          required: [total, trend_pct, peak_total, p95_ms, coverage_start, server_errors, denied, auth_challenges]
          properties:
            total: { type: [integer, "null"] }
            trend_pct:
              type: [number, "null"]
              description: Change versus the previous range of the same length, in percent; null unless that range was recorded entirely and had requests
            peak_total:
              type: [integer, "null"]
              description: Busiest recorded range of the same length ending in the last 30 days (5-minute resolution), at least `total`
            p95_ms:
              type: [number, "null"]
              description: Estimated 95th percentile response time; null without requests
            coverage_start:
              type: [string, "null"]
              format: date-time
              description: Start of the period the numbers cover; later than the range start when recording began inside the range (first start of a version with traffic statistics); null when nothing was recorded yet
            server_errors:
              type: [integer, "null"]
              description: Requests of `total` answered with a 5xx status; counted from the version that introduced it on
            denied:
              type: [integer, "null"]
              description: Requests of `total` refused with 401 or 403, authentication challenges excluded; counted from the version that introduced it on
            auth_challenges:
              type: [integer, "null"]
              description: |
                Requests of `total` answered 401 that presented no credentials
                at all (no Authorization or API key header, no cookie). Clients
                such as NuGet, docker, npm and pip ask without credentials first
                and retry with them, so these are not refusals and are not in
                `denied`; a success rate leaves them out of both sides. Counted
                from the version that introduced it on (earlier ones are in
                `denied`).
        cache:
          type: object
          description: |
            Proxy cache effectiveness over the range, every format, every node.
            A client request counts once: a miss when a remote of any proxy
            repository (directly or as a member of the group addressed)
            supplied content for the answer, otherwise a hit when a proxy
            answered from its cache. Remotes that answered not found or failed
            count as neither. Requests answered by hosted repositories alone
            are not counted. Every value is null when traffic statistics are
            not available.
          required: [hit_ratio, bytes_saved, hits, misses]
          properties:
            hit_ratio:
              type: [number, "null"]
              minimum: 0
              maximum: 1
              description: hits / (hits + misses); null when no proxy request was counted in the range
            bytes_saved:
              type: [integer, "null"]
              description: Bytes served from proxy caches without contacting the remote
            hits: { type: [integer, "null"] }
            misses: { type: [integer, "null"] }
        issues:
          type: object
          required: [critical, packages_affected, quarantined, open_findings]
          properties:
            critical: { type: integer }
            packages_affected: { type: integer }
            quarantined: { type: integer }
            open_findings: { type: integer }
            scanning:
              type: [object, "null"]
              description: Whether the numbers rest on scans; null on servers without a scanner
              required: [enabled, scanned_components, last_scan_at]
              properties:
                enabled: { type: boolean }
                scanned_components: { type: integer }
                last_scan_at: { type: [string, "null"], format: date-time }
        traffic:
          type: array
          items: { $ref: "#/components/schemas/TrafficBucket" }
        storage_by_format:
          type: array
          items:
            type: object
            required: [format, bytes]
            properties:
              format: { $ref: "#/components/schemas/Format" }
              bytes: { $ref: "#/components/schemas/Bytes" }
    UpstreamState:
      type: string
      enum: [healthy, slow, blocked, offline, unknown]
      description: |
        offline = the last request failed (connection error or 5xx) or the
        circuit breaker is open; unknown = the answering node has not sent the
        remote a request since it started (nothing probes remotes in the
        background).
    UpstreamBlockedReason:
      type: string
      enum: [auth_failed, access_denied, address_blocked]
      description: |
        Why a remote is `blocked`: `auth_failed` (it answered 401: the
        upstream credentials are missing, wrong or expired), `access_denied`
        (403: the credentials lack access), `address_blocked` (the outbound
        address policy refused the address).
    UpstreamHealth:
      type: object
      required: [name, url, state, latency_ms, requests]
      properties:
        name:
          type: string
          description: Proxy repository name
        url: { type: string }
        state: { $ref: "#/components/schemas/UpstreamState" }
        reason:
          $ref: "#/components/schemas/UpstreamBlockedReason"
          description: Set when state is blocked
        latency_ms:
          type: [integer, "null"]
          description: |
            Median time to response headers of the remote requests recorded
            over the range (estimated from a histogram); null without remote
            requests in the range
        requests:
          type: [integer, "null"]
          description: Remote requests timed over the range; null when traffic statistics are not available
        last_error:
          type: string
          description: Why the last request to the remote failed, while offline
    CacheInvalidation:
      type: object
      required: [repository, negative_entries, rate_limited_hosts]
      properties:
        repository: { type: string }
        negative_entries:
          type: integer
          description: Remembered remote 404s dropped on the answering node
        rate_limited_hosts:
          type: integer
          description: Hosts whose rate-limit hold was lifted on the answering node
    UpstreamHealthPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UpstreamHealth" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    # ------------------------------------------------------------ repositories
    WritePolicy:
      type: string
      enum: [allow, allow_once, deny]
      description: >-
        Publishing into a hosted repository. allow overwrites freely; allow_once
        accepts a path once (identical bytes again are accepted, different bytes
        answer 409); deny is read-only. Default for a new hosted repository:
        allow_once, except docker (allow: tags move). An update that leaves it
        out keeps the stored policy.
    UpstreamAuth:
      type: object
      required: [kind]
      description: Credentials sent only to the remote's own host. Secrets are write-only.
      properties:
        kind: { type: string, enum: [basic, bearer, header] }
        username: { type: string }
        password: { type: string, writeOnly: true }
        token: { type: string, writeOnly: true }
        header_name:
          type: string
          description: For kind=header, e.g. `Private-Token`
    UpstreamHTTP:
      type: object
      description: Outbound HTTP for one remote; omitted fields inherit the server-wide `http` config.
      properties:
        proxy:
          type: string
          description: "`inherit` (default: the platform default proxy), `none` (direct), or an http://, https:// or socks5:// proxy URL (password write-only)"
        proxy_name:
          type: string
          description: Name of an outbound proxy (`GET /proxies`) to use instead; `proxy` must then be empty or `inherit`.
        ca_bundle:
          type: string
          description: PEM certificates trusted for this remote in addition to the system roots
        insecure_skip_verify:
          type: boolean
          description: Disable TLS verification for this remote (audited)
        connect_timeout: { $ref: "#/components/schemas/Duration" }
        read_timeout:
          $ref: "#/components/schemas/Duration"
          description: Wait for response headers
        body_timeout:
          $ref: "#/components/schemas/Duration"
          description: >-
            Longest wait for more body bytes (default 60s). A stalled
            transfer is aborted, or resumed with a Range request when the
            remote supports it; there is no overall limit for large blobs.
        max_conns_per_host:
          type: integer
          minimum: 0
          description: Connection cap per remote host; 0 = unlimited
        max_idle_conns_per_host:
          type: integer
          minimum: 0
          description: Keep-alive pool size per host; 0 = server-wide `http.max_idle_conns_per_host`
        disable_http2:
          type: boolean
          description: Speak HTTP/1.1 only (remotes or TLS-inspecting proxies with broken HTTP/2)
    ConnectorConfig:
      type: object
      description: Dedicated entry point, mainly for Docker clients that need a host root
      properties:
        host:
          type: string
          description: Virtual host name (e.g. cr.example.com) routed to Hangar
        http_port:
          type: integer
          minimum: 0
          maximum: 65535
          description: Extra plain-HTTP listener serving only this repository; 0 = none
    RepositoryConfig:
      type: object
      description: Exactly one of hosted, proxy, group is set, matching the repository type.
      properties:
        hosted:
          type: object
          properties:
            write_policy: { $ref: "#/components/schemas/WritePolicy" }
        proxy:
          type: object
          required: [remote_url]
          properties:
            remote_url: { type: string, format: uri }
            metadata_ttl: { $ref: "#/components/schemas/Duration" }
            content_ttl: { $ref: "#/components/schemas/Duration" }
            negative_cache_ttl: { $ref: "#/components/schemas/Duration" }
            auth:
              description: >-
                Credentials for the remote. On update: left out keeps the
                stored credentials, null removes them (see updateRepository).
              oneOf:
                - $ref: "#/components/schemas/UpstreamAuth"
                - type: "null"
            http: { $ref: "#/components/schemas/UpstreamHTTP" }
            circuit_failures: { type: integer, minimum: 0 }
            circuit_open_for: { $ref: "#/components/schemas/Duration" }
            related_hosts:
              type: array
              description: >-
                Other hosts the remote links to that may be fetched on its
                behalf (tarball or file CDNs, API hosts): host, host:port or
                `.domain` for its subdomains. Never sent the remote's
                credentials. Formats add their own (PyPI `files.pythonhosted.org`,
                the hosts a NuGet service index names).
              items: { type: string }
            offline:
              type: boolean
              description: >-
                Offline mode: never contact the remote; serve cached content
                (also when stale) and answer 404 for anything not cached.
            max_concurrent_requests:
              type: integer
              minimum: 0
              description: Requests in flight to the remote and its related hosts; 0 = unlimited
        group:
          type: object
          required: [members]
          properties:
            members:
              type: array
              description: Member repository names in resolution order
              items: { $ref: "#/components/schemas/RepositoryName" }
            write_member:
              type: string
              description: Hosted member receiving writes sent to the group (docker, npm)
        anonymous_read: { type: boolean }
        scan_on_arrival: { type: boolean }
        quarantine_critical: { type: boolean }
        scanning:
          type: object
          properties:
            distro:
              type: string
              maxLength: 100
              description: >-
                APT and RPM: the distribution release of the packages, as an OSV
                ecosystem (Debian:12, Ubuntu:22.04:LTS, Rocky Linux:9, AlmaLinux:9,
                Red Hat:enterprise_linux:9::baseos). Their advisories apply to one
                release only. Empty: unknown; proxies of well-known archives are
                detected from the remote.
        cleanup_policies:
          type: array
          items: { type: string }
        connector: { $ref: "#/components/schemas/ConnectorConfig" }
        routing: { $ref: "#/components/schemas/RoutingRules" }
        format:
          type: object
          additionalProperties: true
          description: |
            Format-specific settings. The keys depend on the repository's
            `format`; each format's keys are described by its own schema:
            apt `AptFormatConfig`, cargo `CargoFormatConfig`, docker
            `DockerFormatConfig`, go `GoFormatConfig`, helm `HelmFormatConfig`,
            maven `MavenFormatConfig`, npm `NpmFormatConfig`, nuget
            `NugetFormatConfig`, pypi `PypiFormatConfig`, raw `RawFormatConfig`,
            rpm `RpmFormatConfig` (also listed in `x-format-schemas`). Absent keys
            take the defaults shown there.
          x-format-schemas:
            apt: "#/components/schemas/AptFormatConfig"
            cargo: "#/components/schemas/CargoFormatConfig"
            docker: "#/components/schemas/DockerFormatConfig"
            go: "#/components/schemas/GoFormatConfig"
            helm: "#/components/schemas/HelmFormatConfig"
            maven: "#/components/schemas/MavenFormatConfig"
            npm: "#/components/schemas/NpmFormatConfig"
            nuget: "#/components/schemas/NugetFormatConfig"
            pypi: "#/components/schemas/PypiFormatConfig"
            raw: "#/components/schemas/RawFormatConfig"
            rpm: "#/components/schemas/RpmFormatConfig"
          anyOf:
            - $ref: "#/components/schemas/AptFormatConfig"
            - $ref: "#/components/schemas/CargoFormatConfig"
            - $ref: "#/components/schemas/DockerFormatConfig"
            - $ref: "#/components/schemas/GoFormatConfig"
            - $ref: "#/components/schemas/HelmFormatConfig"
            - $ref: "#/components/schemas/MavenFormatConfig"
            - $ref: "#/components/schemas/NpmFormatConfig"
            - $ref: "#/components/schemas/NugetFormatConfig"
            - $ref: "#/components/schemas/PypiFormatConfig"
            - $ref: "#/components/schemas/RawFormatConfig"
            - $ref: "#/components/schemas/RpmFormatConfig"
    AptFormatConfig:
      type: object
      description: "`config.format` of apt repositories. Both keys apply to hosted and group repositories; a proxy serves the remote's metadata."
      x-format: apt
      additionalProperties: true
      properties:
        architectures:
          type: array
          items: { type: string, examples: [amd64, arm64, i386] }
          description: Architectures listed in every distribution besides those of the uploaded packages (not `all`). Default `[amd64, arm64]`.
        signing_key:
          type: string
          enum: [repository, shared]
          description: Key that signs the metadata. Default `repository` (the repository's own key).
    CargoFormatConfig:
      type: object
      description: "`config.format` of cargo repositories."
      x-format: cargo
      additionalProperties: true
      properties:
        download_url:
          type: string
          format: uri
          description: |
            Proxy only: the remote's crate download template, as `dl` in its
            `config.json` (markers `{crate}`, `{version}`, `{prefix}`,
            `{lowerprefix}`, `{sha256-checksum}`; without markers
            `/{crate}/{version}/download` is appended). Default: the remote's own `dl`.
          examples: ["https://static.crates.io/crates"]
    DockerFormatConfig:
      type: object
      description: "`config.format` of docker repositories: none. Host and port connectors are `config.connector`."
      x-format: docker
      additionalProperties: true
      properties: {}
    GoFormatConfig:
      type: object
      description: "`config.format` of go repositories."
      x-format: go
      additionalProperties: true
      properties:
        sumdbs:
          type: array
          items: { type: string, examples: [sum.golang.org] }
          description: Proxy only. Checksum databases served under `sumdb/<name>/`. Absent means `[sum.golang.org]`; an empty list turns the pass-through off.
        sumdb_via:
          type: string
          enum: [database, remote]
          description: Proxy only. Where checksum database requests go. `database` (default) asks `https://<name>/` itself; `remote` asks `<remote_url>/sumdb/<name>/`, for remotes that proxy the database (an inner Hangar, Athens).
    HelmFormatConfig:
      type: object
      description: "`config.format` of helm repositories: none; any key is rejected."
      x-format: helm
      additionalProperties: true
      maxProperties: 0
      properties: {}
    MavenFormatConfig:
      type: object
      description: "`config.format` of maven repositories. Other keys are rejected."
      x-format: maven
      additionalProperties: true
      properties:
        version_policy:
          type: string
          enum: [release, snapshot, mixed]
          description: Versions the repository accepts. Default `mixed`.
        layout_policy:
          type: string
          enum: [strict, permissive]
          description: "`strict` stores only Maven-layout paths; `permissive` also stores other files. Default `strict`."
    NpmFormatConfig:
      type: object
      description: "`config.format` of npm repositories."
      x-format: npm
      additionalProperties: true
      properties:
        unpublish_window:
          allOf: [{ $ref: "#/components/schemas/Duration" }]
          description: How long after publishing a holder of `repo:<name>:delete` may unpublish a version (`repo:<name>:admin` always may). Default `72h`; `0s` means administrators only.
        login_token_ttl:
          allOf: [{ $ref: "#/components/schemas/Duration" }]
          description: Lifetime of tokens issued by `npm login`. Default `720h` (30 days).
        reuse_unpublished_versions:
          type: boolean
          description: Let a version number be published again after it was unpublished. Default false (a version always names the same bytes).
    NugetFormatConfig:
      type: object
      description: "`config.format` of nuget repositories."
      x-format: nuget
      additionalProperties: true
      properties:
        delete_mode:
          type: string
          enum: [unlist, delete]
          description: What `DELETE api/v2/package/{id}/{version}` (`dotnet nuget delete`) does. Default `unlist`.
        service_index:
          type: string
          description: |
            Proxy only. The remote's service index path, relative to `remote_url`. Default `v3/index.json`.
            Sensitive, as some feeds carry their key in this path: returned only to administrators of
            the repository (`repo:<name>:admin`, `system:repos:admin`), as `***` to everyone else. An
            update that sends `***` keeps the stored value.
          examples: [v3/index.json, index.json]
    PypiFormatConfig:
      type: object
      description: "`config.format` of pypi repositories."
      x-format: pypi
      additionalProperties: true
      properties:
        file_hosts:
          type: array
          items: { type: string, examples: [files.pythonhosted.org, .example.com] }
          description: Proxy only. Hosts (`host`, `host:port`, or `.domain` for its subdomains) distribution files may be downloaded from when the remote links elsewhere. Default `[files.pythonhosted.org]`; the remote's own host is always allowed.
    RawFormatConfig:
      type: object
      description: "`config.format` of raw repositories: none; any key is rejected."
      x-format: raw
      additionalProperties: true
      maxProperties: 0
      properties: {}
    RpmFormatConfig:
      type: object
      description: "`config.format` of rpm repositories. Both keys apply to hosted and group repositories; a proxy serves the remote's metadata."
      x-format: rpm
      additionalProperties: true
      properties:
        repodata_depth:
          type: integer
          minimum: 0
          maximum: 4
          description: Directory depth that holds `repodata/`. Default 0 (one yum repository); 2 serves e.g. `el9/x86_64/repodata/` for packages uploaded below `el9/x86_64/`.
        signing_key:
          type: string
          enum: [repository, shared]
          description: Key that signs the metadata. Default `repository` (the repository's own key).
    RoutingRules:
      type: object
      description: >-
        Dependency-confusion guard. A name a rule excludes is never fetched
        from a proxy's remote, not served from its cache, and left out of a
        group's merged metadata (version lists, indexes, search); downloads
        answer 404 with the reason in the body and the `X-Hangar-Routing`
        header. Block wins over allow and exclusive.
      properties:
        allow:
          type: array
          description: Proxy repositories. When set, only names matching one of these are fetched and served.
          items: { type: string, maxLength: 256 }
          maxItems: 256
        block:
          type: array
          description: Proxy repositories. Names matching one of these are never fetched nor served.
          items: { type: string, maxLength: 256 }
          maxItems: 256
          example: ["Edcom.*"]
        members:
          type: array
          description: Group repositories. Rules for direct members; each member must be in the group.
          items: { $ref: "#/components/schemas/MemberRouting" }
    MemberRouting:
      type: object
      required: [member]
      properties:
        member: { $ref: "#/components/schemas/RepositoryName" }
        exclusive:
          type: array
          description: >-
            Names reserved for this member: a name matching the exclusive
            patterns of one or more members is served only by them.
          items: { type: string, maxLength: 256 }
          maxItems: 256
          example: ["Edcom.*"]
        block:
          type: array
          description: Names this member never serves through the group.
          items: { type: string, maxLength: 256 }
          maxItems: 256
    RoutingBlock:
      type: object
      required: [repository, rule, name]
      properties:
        repository: { type: string, description: Repository holding the rule (the proxy or the group) }
        member: { type: string, description: Group member the rule excludes }
        rule: { type: string, enum: [block, allow, exclusive] }
        pattern: { type: string, description: The pattern that matched; empty when no allow pattern matched }
        owners:
          type: array
          description: Members reserving the name (exclusive rules)
          items: { type: string }
        name: { type: string }
    RoutingTest:
      type: object
      required: [repository, format, name, normalized, allowed, members]
      properties:
        repository: { type: string }
        format: { $ref: "#/components/schemas/Format" }
        name: { type: string }
        normalized: { type: string, description: The name as the rules compare it }
        allowed: { type: boolean, description: At least one source may serve the name }
        block: { $ref: "#/components/schemas/RoutingBlock" }
        served_by: { type: string, description: First hosted or proxy member, in resolution order, that may serve the name }
        members:
          type: array
          items:
            type: object
            required: [repository, type, via, allowed, online]
            properties:
              repository: { type: string }
              type: { $ref: "#/components/schemas/RepositoryType" }
              via:
                type: array
                description: Groups between the tested repository and this member
                items: { type: string }
              allowed: { type: boolean }
              online: { type: boolean }
              block: { $ref: "#/components/schemas/RoutingBlock" }
    RoutingSuggestions:
      type: object
      required: [repository, suggestions, truncated]
      properties:
        repository: { type: string }
        truncated: { type: boolean, description: A source had more components than were read }
        suggestions:
          type: array
          items:
            type: object
            required: [pattern, matches, examples, source]
            properties:
              pattern: { type: string, example: Edcom.* }
              matches: { type: integer }
              examples:
                type: array
                items: { type: string }
              source: { type: string, description: Hosted repository publishing the names }
              member: { type: string, description: Groups only; the direct member the source is reached through }
    RepositoryInput:
      type: object
      required: [name, format, type, config]
      properties:
        name: { $ref: "#/components/schemas/RepositoryName" }
        format: { $ref: "#/components/schemas/Format" }
        type: { $ref: "#/components/schemas/RepositoryType" }
        description: { type: string }
        blob_store:
          type: string
          description: |
            Required for hosted and proxy repositories. Ignored for groups,
            which store nothing; their responses leave it out.
        online:
          type: boolean
          description: Optional; true when omitted
        config: { $ref: "#/components/schemas/RepositoryConfig" }
    RepositoryStatus:
      type: string
      enum: [online, slow_upstream, blocked, offline]
    RepositoryStatusReason:
      type: string
      enum: [auth_failed, access_denied, address_blocked, upstream_unreachable, blob_store_unavailable]
      description: |
        Why a proxy is `blocked` (see UpstreamBlockedReason), or why an
        enabled repository is `offline`: its remote's last request failed
        (`upstream_unreachable`) or its blob store failed the last health
        probe (`blob_store_unavailable`). Absent for a disabled repository.
    Repository:
      allOf:
        - $ref: "#/components/schemas/RepositoryInput"
        - type: object
          required: [id, url, status, size_bytes, component_count, created_at, updated_at, last_activity_at]
          properties:
            id: { type: string }
            url:
              type: string
              description: Client URL built from server.base_url
            status: { $ref: "#/components/schemas/RepositoryStatus" }
            status_reason:
              $ref: "#/components/schemas/RepositoryStatusReason"
            status_detail:
              type: string
              description: The error behind an offline status (the store's or the remote's)
            size_bytes:
              allOf: [{ $ref: "#/components/schemas/Bytes" }]
              description: |
                Hosted and proxy: the total size of the repository's assets.
                Group: what the group serves; every blob stored by its
                members (nested groups resolved) counted once.
            component_count:
              type: integer
              description: |
                Hosted and proxy: the repository's components. Group: the
                distinct component coordinates (namespace, name, version) of
                its members, nested groups resolved.
            created_at: { $ref: "#/components/schemas/Timestamp" }
            updated_at: { $ref: "#/components/schemas/Timestamp" }
            last_activity_at:
              type: [string, "null"]
              format: date-time
              description: |
                Latest upload, cache fill or download in this repository (for a group, in its
                direct members); null when there was none. Downloads are counted in batches,
                so this can lag by the download statistics flush interval.
    RepositoryList:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Repository" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
        counts:
          type: object
          description: Totals ignoring the type filter (tab badges, count cards)
          required: [all, hosted, proxy, group]
          properties:
            all: { type: integer }
            hosted: { type: integer }
            proxy: { type: integer }
            group: { type: integer }

    # ------------------------------------------------------------ blob stores
    BlobStoreInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [fs, s3] }
        soft_quota_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Soft quota; null or absent = none
        fs:
          type: object
          properties:
            path: { type: string }
        s3:
          type: object
          properties:
            endpoint: { type: string }
            region: { type: string }
            bucket: { type: string }
            prefix: { type: string }
            access_key_id: { type: string }
            secret_access_key: { type: string, writeOnly: true }
            use_path_style: { type: boolean }
    BlobStore:
      allOf:
        - $ref: "#/components/schemas/BlobStoreInput"
        - type: object
          required: [id, state, location, used_bytes, repository_count, blob_count]
          properties:
            id: { type: string }
            state:
              type: string
              enum: [ok, degraded, unavailable, read_only, unknown]
              description: |
                From the System status blob storage check, which probes every
                store each heartbeat: ok, degraded (low on free space),
                unavailable (the probe failed). unknown before the first probe.
            state_detail:
              type: string
              description: What the last probe found, e.g. the error of an unavailable store
            checked_at:
              allOf: [{ $ref: "#/components/schemas/Timestamp" }]
              description: When the store was last probed
            state_since:
              allOf: [{ $ref: "#/components/schemas/Timestamp" }]
              description: Since when the store has this state (on the answering node)
            location:
              type: string
              description: Human-readable location (bucket/prefix or path)
            used_bytes: { $ref: "#/components/schemas/Bytes" }
            capacity_bytes:
              type: [integer, "null"]
              description: Null when the backend has no fixed capacity
            repository_count: { type: integer }
            blob_count: { type: integer }
            reclaimable_bytes: { $ref: "#/components/schemas/Bytes" }
            dedup_saved_bytes: { $ref: "#/components/schemas/Bytes" }
            created_at: { $ref: "#/components/schemas/Timestamp" }
            write_latency_ms: { type: [number, "null"] }
            encryption:
              type: string
              description: e.g. "SSE-S3", "SSE-KMS", "none"
    BlobStoreList:
      type: object
      required: [items, totals]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BlobStore" }
        totals:
          type: object
          required: [used_bytes, dedup_saved_bytes, growth_bytes_per_day, reclaimable_bytes]
          properties:
            used_bytes: { $ref: "#/components/schemas/Bytes" }
            capacity_bytes: { type: [integer, "null"] }
            dedup_saved_bytes: { $ref: "#/components/schemas/Bytes" }
            growth_bytes_per_day: { type: integer }
            days_to_full: { type: [number, "null"] }
            reclaimable_bytes:
              allOf: [{ $ref: "#/components/schemas/Bytes" }]
              description: Soft-deleted bytes a compaction would free now

    # ------------------------------------------------------------ components
    ScanState:
      type: string
      description: >-
        pending: never scanned; clean: scanned, no open finding; findings: open
        or assigned findings; quarantined: blocked from download; failed: the
        last scan failed; unsupported: the format has no advisory source
        (Docker images: image scanning not configured).
      enum: [pending, clean, findings, quarantined, failed, unsupported]
    ScanSummary:
      type: object
      required: [state, critical, high, medium, low]
      properties:
        state: { $ref: "#/components/schemas/ScanState" }
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        scanned_at:
          type: [string, "null"]
          format: date-time
          description: Last scan attempt
        scan_error:
          type: string
          description: Why the last scan failed, or why the format is not scanned (`image scanning not configured`)
    Publisher:
      type: object
      required: [kind, display_name]
      properties:
        kind: { type: string, enum: [user, ci, service_account] }
        display_name: { type: string }
    PublishedComponent:
      type: object
      required: [id, format, name, version, repository, publisher, published_at, scan]
      properties:
        id: { type: string }
        format: { $ref: "#/components/schemas/Format" }
        namespace:
          type: string
          description: Scope / groupId / image path prefix; empty when the format has none
        name: { type: string }
        version: { type: string }
        repository: { type: string }
        publisher: { $ref: "#/components/schemas/Publisher" }
        published_at: { $ref: "#/components/schemas/Timestamp" }
        scan: { $ref: "#/components/schemas/ScanSummary" }
        download_count: { type: integer }
        last_downloaded_at: { type: [string, "null"], format: date-time }
        size_bytes:
          $ref: "#/components/schemas/Bytes"
          description: Content size; reported by the versions listing
    PublishedComponentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublishedComponent" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    ComponentDetail:
      allOf:
        - $ref: "#/components/schemas/PublishedComponent"
        - type: object
          required: [size_bytes, checksums, install_command, signed, quarantined]
          properties:
            size_bytes: { $ref: "#/components/schemas/Bytes" }
            digest:
              type: string
              description: Primary digest (OCI manifest digest or main file sha256)
            checksums:
              type: object
              additionalProperties: { type: string }
            install_command:
              type: string
              description: Pull/install command for the format, built from server.base_url
            signed: { type: boolean }
            platforms:
              type: array
              items: { type: string }
              examples: [["linux/amd64", "linux/arm64"]]
            quarantined: { type: boolean }
            quarantine_reason: { type: string }
            downloads_30d: { type: integer }
            last_downloaded_by: { type: string }
            base_image: { type: string }
            source_url:
              type: string
              description: Source commit link when provenance is known
            license: { type: string }
            attributes:
              type: object
              additionalProperties: true
    Asset:
      type: object
      required: [id, path, kind, blob_digest, content_type, size_bytes, created_at]
      properties:
        id: { type: string }
        path: { type: string }
        kind: { type: string, enum: [content, metadata] }
        blob_digest: { type: string }
        content_type: { type: string }
        size_bytes: { $ref: "#/components/schemas/Bytes" }
        checksums:
          type: object
          additionalProperties: { type: string }
        download_url: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_downloaded_at: { type: [string, "null"], format: date-time }
    AssetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    BrowseComponent:
      type: object
      required: [id, namespace, name, version]
      properties:
        id: { type: string }
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
    BrowseAsset:
      type: object
      required: [id, path, kind, content_type, size_bytes, created_at, updated_at, download_count]
      properties:
        id: { type: string }
        path:
          type: string
          description: Storage path inside the repository (download path)
        kind: { type: string, enum: [content, metadata] }
        content_type: { type: string }
        size_bytes: { $ref: "#/components/schemas/Bytes" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        last_downloaded_at: { type: [string, "null"], format: date-time }
        download_count: { type: integer }
    BrowseEntry:
      type: object
      required: [name, path, kind, repository]
      properties:
        name: { type: string }
        path:
          type: string
          description: Path in the browse tree; folders end in "/"
        kind:
          type: string
          enum: [folder, package, version, asset]
          description: A package or version folder holds one package or one version
        repository:
          type: string
          description: Repository that holds the entry (for a group, the first member that has it)
        repositories:
          type: array
          items: { type: string }
          description: Groups only; every member that has the entry, in resolution order
        component:
          $ref: "#/components/schemas/BrowseComponent"
          description: Package and version folders, and files that belong to a version
        asset: { $ref: "#/components/schemas/BrowseAsset" }
    BrowsePage:
      type: object
      required: [repository, format, path, items]
      properties:
        repository: { type: string }
        format: { $ref: "#/components/schemas/Format" }
        path: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/BrowseEntry" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    AssetDetail:
      type: object
      required: [id, path, repository, repository_type, format, kind, content_type, size_bytes, blob_digest, checksums,
        created_at, updated_at, blob_created_at, last_downloaded_at, download_count, cached_from_remote]
      properties:
        id: { type: string }
        path: { type: string }
        repository: { type: string }
        repository_type: { $ref: "#/components/schemas/RepositoryType" }
        format: { $ref: "#/components/schemas/Format" }
        kind: { type: string, enum: [content, metadata] }
        content_type: { type: string }
        size_bytes: { $ref: "#/components/schemas/Bytes" }
        blob_digest: { type: string }
        checksums:
          type: object
          description: Hex digests by algorithm; sha256 is always present
          additionalProperties: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        blob_created_at:
          type: [string, "null"]
          format: date-time
          description: When the blob store first received these bytes
        last_downloaded_at: { type: [string, "null"], format: date-time }
        download_count: { type: integer }
        cached_from_remote:
          type: boolean
          description: The file is a proxy repository's cached copy of remote content
        remote_url: { type: string }
        component: { $ref: "#/components/schemas/BrowseComponent" }
        download_url:
          type: string
          description: Absent for Docker, whose files are fetched with the registry protocol
    Readme:
      type: object
      required: [format, content, source, truncated, images]
      properties:
        format:
          type: string
          enum: [markdown, text]
          description: Markdown, or plain text (other markups are shown as text)
        content: { type: string }
        source:
          type: string
          description: Where the README was found, e.g. "README.md in the package tarball"
        truncated:
          type: boolean
          description: The README was longer than 512 KiB and was cut
        images:
          type: object
          additionalProperties: { type: string }
          description: >-
            Each image source of a Markdown README, as written in it (Markdown
            images and HTML img tags), mapped to the URL the browser loads:
            a signed `/components/{id}/readme-images/...` URL, or in direct
            mode the remote https URL itself. Relative paths are resolved
            inside the package, else in the source repository (github.com,
            gitlab.com). Sources left out are shown as their alternative text.
    ComponentInfo:
      type: object
      required: [licenses, keywords, readme_images]
      properties:
        description: { type: string }
        licenses:
          type: array
          items: { type: string }
          description: SPDX expressions, licence names or licence URLs as the package declares them
        keywords:
          type: array
          items: { type: string }
        homepage: { type: string }
        readme: { $ref: "#/components/schemas/Readme" }
        icon_url:
          type: string
          description: The package's own icon (NuGet `<icon>` in the .nupkg, or `<iconUrl>`), loadable like `readme.images`
        readme_images:
          type: string
          enum: [proxy, direct, off]
          description: How README images on other hosts are shown (`ui.readme_images`)

    # ------------------------------------------------------------ search
    FacetValue:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    SearchHit:
      type: object
      required: [component_id, format, coordinates, repository, versions, downloads, security]
      properties:
        component_id:
          type: string
          description: Newest matching version
        format: { $ref: "#/components/schemas/Format" }
        coordinates:
          type: string
          description: Rendered in the format's idiom (`@acme/ui@5.3.1`, `com.acme:ledger-core:7.0.0`)
        namespace: { type: string }
        name: { type: string }
        version:
          type: string
          description: Newest matching version
        repository: { type: string }
        versions: { type: integer }
        downloads: { type: integer }
        security: { $ref: "#/components/schemas/ScanState" }
        published_at: { $ref: "#/components/schemas/Timestamp" }
    SearchResult:
      type: object
      required: [items, total, facets]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
        total: { type: integer }
        facets:
          type: object
          required: [format, security, repository]
          properties:
            format:
              type: array
              items: { $ref: "#/components/schemas/FacetValue" }
            security:
              type: array
              items: { $ref: "#/components/schemas/FacetValue" }
            repository:
              type: array
              items: { $ref: "#/components/schemas/FacetValue" }

    # ------------------------------------------------------------ security
    FindingStatus:
      type: string
      enum: [open, assigned, waived, fixed]
    Finding:
      type: object
      required: [id, advisory_id, title, severity, package, installed, status, affected_components]
      properties:
        id: { type: string }
        kind: { type: string, enum: [vulnerability, license] }
        advisory_id: { type: string, examples: ["CVE-2026-1234", "GHSA-xxxx-xxxx-xxxx"] }
        aliases:
          type: array
          description: Other ids of the same advisory (CVE, GHSA)
          items: { type: string }
        title: { type: string, description: One-line summary of the advisory }
        details:
          type: string
          description: Advisory text (Markdown); only in GET /findings/{id}
        severity: { $ref: "#/components/schemas/Severity" }
        cvss: { type: [number, "null"], description: CVSS base score }
        cvss_vector: { type: [string, "null"], description: CVSS v4.0 or v3.x vector the score comes from }
        package: { type: string, description: Package name as the advisory names it }
        installed: { type: string }
        fixed_in:
          type: [string, "null"]
          description: Lowest version that fixes the installed one; null when no fix is known
        fixed_versions:
          type: array
          items: { type: string }
        affected_versions:
          type: string
          examples: [">=4.0.0, <4.5.1; >=4.6.0, <4.7.2"]
        references:
          type: array
          items:
            type: object
            required: [type, url]
            properties:
              type: { type: string, examples: ["ADVISORY", "WEB", "FIX", "PACKAGE"] }
              url: { type: string }
        status: { $ref: "#/components/schemas/FindingStatus" }
        quarantined: { type: boolean, description: The component is quarantined }
        affected_components:
          type: integer
          description: Readable components with an unresolved finding for the same advisory
        waiver_reason:
          type: [string, "null"]
          description: Reason of the current waiver, or of the last one when it expired
        waiver_until: { type: [string, "null"], format: date-time }
        waived_by: { type: [string, "null"] }
        waived_at: { type: [string, "null"], format: date-time }
        assignee: { type: [string, "null"], description: Username of the Hangar user responsible }
        assigned_by: { type: [string, "null"] }
        assigned_at: { type: [string, "null"], format: date-time }
        source: { type: string, enum: [osv, trivy], description: "`osv` for packages, `trivy` for container images" }
        location:
          type: string
          description: File of a library inside an image (a jar, a lock file, a binary); empty otherwise
          examples: ["app/lib/log4j-core-2.14.1.jar"]
        image:
          oneOf:
            - $ref: "#/components/schemas/ImageFindingDetails"
            - type: "null"
          description: Container image findings only
        first_seen_at: { $ref: "#/components/schemas/Timestamp" }
        last_seen_at: { $ref: "#/components/schemas/Timestamp" }
        resolved_at:
          type: [string, "null"]
          format: date-time
          description: When a rescan stopped reporting the advisory (status fixed)
        advisory_published_at: { type: [string, "null"], format: date-time }
        advisory_modified_at: { type: [string, "null"], format: date-time }
        component:
          type: object
          required: [id, repository, format, namespace, name, version]
          properties:
            id: { type: string }
            repository: { type: string }
            format: { $ref: "#/components/schemas/Format" }
            namespace: { type: string }
            name: { type: string }
            version: { type: string }
    ImageFindingDetails:
      type: object
      description: What the image scanner reported about a vulnerable package inside an image
      required: [class, type, target, platforms]
      properties:
        class:
          type: string
          enum: [os-pkgs, lang-pkgs]
          description: "`os-pkgs`: installed by the distribution; `lang-pkgs`: a library of an application"
        type: { type: string, examples: ["alpine", "debian", "jar", "node-pkg", "gobinary"] }
        target: { type: string, description: The scanned part (the OS, or the file a library was read from) }
        os: { type: string, examples: ["alpine 3.10.9"] }
        layer: { type: string, description: Digest of the layer that installed the package }
        diff_id: { type: string }
        platforms:
          type: array
          description: Platforms of a multi-platform image the package was found in
          items: { type: string, examples: ["linux/amd64"] }
        fix_status:
          type: string
          description: The distribution's verdict
          examples: ["fixed", "affected", "will_not_fix", "fix_deferred", "end_of_life"]
        data_source: { type: string, examples: ["Alpine Secdb"] }
        primary_url: { type: string }
    ComponentScan:
      type: object
      required: [status, scanned_at]
      properties:
        status:
          type: string
          enum: [never, ok, failed, unsupported]
        error:
          type: string
          description: Why the last scan failed, or why the component is not scanned (no advisory source, image scanning not configured, not a container image)
        scanned_at: { type: [string, "null"], format: date-time }
    ComponentFindings:
      allOf:
        - $ref: "#/components/schemas/FindingPage"
        - type: object
          required: [scan]
          properties:
            scan: { $ref: "#/components/schemas/ComponentScan" }
    ScanCounts:
      type: object
      required: [scanned, failed, findings, new_findings, quarantined, released]
      properties:
        scanned: { type: integer }
        failed: { type: integer }
        findings: { type: integer }
        new_findings: { type: integer }
        quarantined: { type: integer }
        released: { type: integer }
    ScanResult:
      type: object
      required: [component_id, scan, summary]
      properties:
        component_id: { type: string }
        scan: { $ref: "#/components/schemas/ComponentScan" }
        summary: { $ref: "#/components/schemas/ScanCounts" }
    RepositoryScanQueued:
      type: object
      required: [repository, components]
      properties:
        repository: { type: string }
        components: { type: integer }
    SeverityCounts:
      type: object
      required: [critical, high, medium, low]
      properties:
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        unknown: { type: integer }
    FindingTrendPoint:
      type: object
      required: [date, critical, high, medium, low, new, resolved]
      properties:
        date: { type: string, format: date }
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer, description: Low and unknown }
        new: { type: integer }
        resolved: { type: integer }
    FindingTrend:
      type: object
      required: [days, items]
      properties:
        days: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/FindingTrendPoint" }
    ScanningStatus:
      type: object
      required: [enabled, source, source_url, rescan_interval, supported_formats, coverage]
      properties:
        enabled: { type: boolean }
        source: { type: string, examples: ["osv"] }
        source_url: { type: string, examples: ["https://api.osv.dev"] }
        rescan_interval: { $ref: "#/components/schemas/Duration" }
        supported_formats:
          type: array
          items: { type: string }
        coverage:
          type: object
          required: [scanned, failed, never, unsupported, last_scan_at]
          properties:
            scanned: { type: integer }
            failed: { type: integer }
            never: { type: integer }
            unsupported: { type: integer }
            last_scan_at: { type: [string, "null"], format: date-time }
        images: { $ref: "#/components/schemas/ImageScanningStatus" }
    ImageScanningStatus:
      type: object
      description: Container image scanning with Trivy (scanner.trivy_url)
      required: [enabled, scanner]
      properties:
        enabled: { type: boolean, description: A Trivy server and the scan adapter are configured }
        scanner: { type: string, examples: ["trivy"] }
        server_url: { type: string, examples: ["http://trivy:4954"] }
        platforms: { type: string, enum: [all, default] }
        version: { type: string, description: Trivy server version, examples: ["0.76.1"] }
        db_updated_at: { type: [string, "null"], format: date-time, description: When the server's vulnerability database was built }
        error: { type: string, description: Why the Trivy server could not be asked }
    FindingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    FindingList:
      allOf:
        - $ref: "#/components/schemas/FindingPage"
        - type: object
          required: [totals, total, fixable, waived, components]
          properties:
            total: { type: integer, description: Findings matching the filters }
            totals:
              allOf: [{ $ref: "#/components/schemas/SeverityCounts" }]
              description: Open findings by severity
            fixable:
              allOf: [{ $ref: "#/components/schemas/SeverityCounts" }]
              description: Open findings with a known fix, by severity
            waived: { type: integer, description: Findings under an active waiver }
            components: { type: integer, description: Components with an open finding }
    WaiverInput:
      type: object
      required: [reason, until]
      properties:
        reason: { type: string, minLength: 3, maxLength: 2000 }
        until:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: In the future, at most a year ahead

    Pullers:
      type: object
      required: [component_id, window_days, pulls, clients, pulls_since, items]
      properties:
        component_id: { type: string }
        window_days: { type: integer }
        pulls: { type: integer, description: Downloads in the window }
        clients: { type: integer, description: Distinct clients in the window }
        pulls_since: { type: [string, "null"], format: date, description: First day with pull records }
        items:
          type: array
          items: { $ref: "#/components/schemas/Puller" }
    Puller:
      type: object
      required: [label, principal, kind, address, agent, pulls, last_at]
      properties:
        label: { type: string, examples: ["ci-publisher", "10.0.4.12 · NuGet"] }
        principal: { type: [string, "null"] }
        kind: { type: string, enum: [user, service_account, anonymous] }
        address: { type: string }
        agent: { type: string, description: Client kind from the user agent, examples: ["NuGet", "npm", "Browser"] }
        pulls: { type: integer }
        last_at: { $ref: "#/components/schemas/Timestamp" }
    AssigneeInput:
      type: object
      required: [assignee]
      properties:
        assignee: { type: string, description: Username of an active user }
    Assignee:
      type: object
      required: [username, display_name]
      properties:
        username: { type: string }
        display_name: { type: string }
    PackageAssignInput:
      type: object
      required: [package]
      properties:
        package: { type: string, description: "Package key `<format>:<package>`", examples: ["nuget:Newtonsoft.Json"] }
        assignee: { type: [string, "null"], description: Username; null or empty removes the assignee }
    PackageWaiverInput:
      type: object
      required: [package, reason, until]
      properties:
        package: { type: string, examples: ["nuget:Newtonsoft.Json"] }
        finding_ids:
          type: array
          description: Findings of the package to waive; empty = every unresolved one
          items: { type: string }
        reason: { type: string, minLength: 3, maxLength: 2000 }
        until:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: In the future, at most a year ahead
    PackageChange:
      type: object
      required: [key, findings]
      properties:
        key: { type: string }
        findings:
          type: array
          description: Ids of the findings changed
          items: { type: string }
    FixPlan:
      type: object
      required: [tab, window_days, in_use_days, pulls_since, summary, items]
      properties:
        tab: { type: string, enum: [in_use, all, waived] }
        window_days: { type: integer }
        in_use_days: { type: integer }
        pulls_since: { type: [string, "null"], format: date }
        summary: { $ref: "#/components/schemas/FixPlanSummary" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PackagePlan" }
    FixPlanSummary:
      type: object
      required: [packages, packages_in_use, packages_to_upgrade, findings, findings_in_use, findings_unused, findings_fixed_in_use, waived_packages]
      properties:
        packages: { type: integer, description: Packages with open findings }
        packages_in_use: { type: integer }
        packages_to_upgrade: { type: integer, description: In-use packages whose upgrade fixes at least one finding }
        findings: { type: integer, description: Open findings }
        findings_in_use: { type: integer }
        findings_unused: { type: integer }
        findings_fixed_in_use: { type: integer, description: In-use findings the upgrades fix }
        waived_packages: { type: integer }
    UpgradeLine:
      type: object
      required: [line, from, to, command, fixes, unfixed]
      properties:
        line: { type: string, description: Major version of the vulnerable versions, examples: ["8"] }
        from:
          type: array
          items: { type: string }
        to: { type: [string, "null"], description: Lowest version fixing every fixable finding of the line }
        command:
          type: [string, "null"]
          examples: ["dotnet add package System.Text.Json --version 8.0.5"]
        fixes: { type: integer }
        unfixed: { type: integer, description: Findings of the line without any fixing release }
    PlanFinding:
      type: object
      required: [id, advisory_id, aliases, title, severity, cvss, status, installed, fixed_in, assignee, waiver_until, component_id, repository, in_use, pulls, clients]
      properties:
        id: { type: string }
        advisory_id: { type: string }
        aliases:
          type: array
          items: { type: string }
        title: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        cvss: { type: [number, "null"] }
        status: { $ref: "#/components/schemas/FindingStatus" }
        installed: { type: string }
        fixed_in: { type: [string, "null"] }
        assignee: { type: [string, "null"] }
        waiver_until: { type: [string, "null"], format: date-time }
        component_id: { type: string }
        repository: { type: string }
        in_use: { type: boolean }
        pulls: { type: integer }
        clients: { type: integer }
        package: { type: string, description: The vulnerable package (for an image, the package inside it) }
        version: { type: string, description: The component version (the tag of an image) }
        location: { type: string }
        image:
          oneOf:
            - $ref: "#/components/schemas/ImageFindingDetails"
            - type: "null"
    ImagePlan:
      type: object
      description: |
        How to fix an image: rebuild it on a base image whose distribution
        ships the fixed OS packages (or with them upgraded in the
        Dockerfile), with the application's libraries upgraded.
      required: [os, packages, command]
      properties:
        os: { type: string, examples: ["alpine 3.10.9"] }
        packages:
          type: array
          items:
            type: object
            required: [name, class, type, location, installed, fixed_in, findings, unfixed, max_severity]
            properties:
              name: { type: string }
              class: { type: string, enum: [os, library] }
              type: { type: string }
              location: { type: string }
              installed:
                type: array
                items: { type: string }
              fixed_in: { type: [string, "null"], description: Version that fixes every finding of the package with a fix }
              findings: { type: integer }
              unfixed: { type: integer }
              max_severity: { $ref: "#/components/schemas/Severity" }
        command:
          type: [string, "null"]
          description: Dockerfile line upgrading the OS packages with a fix
          examples: ["RUN apk upgrade --no-cache libcrypto3 libssl3"]
    PackagePlan:
      type: object
      required: [key, format, package, repositories, advisories, versions, findings, max_severity, max_cvss, severities, upgrades, fixable, pulls, clients, in_use, last_pulled_at, assignee, assignee_mixed, items]
      properties:
        key: { type: string, examples: ["nuget:Newtonsoft.Json"] }
        format: { $ref: "#/components/schemas/Format" }
        package: { type: string }
        repositories:
          type: array
          items: { type: string }
        advisories:
          type: array
          description: Most severe first
          items:
            type: object
            required: [id, aliases, severity, cvss]
            properties:
              id: { type: string }
              aliases:
                type: array
                items: { type: string }
              severity: { $ref: "#/components/schemas/Severity" }
              cvss: { type: [number, "null"] }
        versions:
          type: array
          description: Vulnerable versions in the registry, lowest first
          items: { type: string }
        findings: { type: integer }
        max_severity: { $ref: "#/components/schemas/Severity" }
        max_cvss: { type: [number, "null"] }
        severities: { $ref: "#/components/schemas/SeverityCounts" }
        upgrades:
          type: array
          items: { $ref: "#/components/schemas/UpgradeLine" }
        fixable: { type: integer, description: Findings the upgrades fix }
        pulls: { type: integer, description: Downloads of the vulnerable versions in the window }
        clients: { type: integer, description: Distinct clients behind them }
        in_use: { type: boolean }
        last_pulled_at: { type: [string, "null"], format: date-time }
        assignee: { type: [string, "null"], description: Shared by every finding; null when none or mixed }
        assignee_mixed: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlanFinding" }
        image:
          oneOf:
            - $ref: "#/components/schemas/ImagePlan"
            - type: "null"
          description: "Container images (format docker): the key is `docker:<image>` and versions are its tags"
    Rescan:
      type: object
      required: [id, started_at, started_by, repositories, total, done, state]
      properties:
        id: { type: string }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        started_by: { type: string }
        repositories: { type: integer }
        total: { type: integer, description: Components that existed when it started }
        done: { type: integer, description: Of them, scanned since (successfully or not) }
        state:
          type: string
          enum: [running, done, stalled]
          description: stalled = not finished within 3 hours
    RescanStarted:
      type: object
      required: [run, started]
      properties:
        run: { $ref: "#/components/schemas/Rescan" }
        started: { type: boolean }

    # ------------------------------------------------------------ cleanup
    CleanupCriteria:
      type: object
      description: |
        Scope: `version_include` (if set) must match and, with
        `prerelease_only`, only pre-release / snapshot versions count. Versions
        matching `version_exclude` or a `keep_matching` glob, quarantined
        versions and versions under legal hold (component attribute
        `legal_hold: true`) are never deleted and do not use `keep_newest`
        slots. Of the rest, the `keep_newest` most recently published versions
        per package are kept; the others are deleted when every set condition
        holds (AND). At least one of `older_than_days`, `not_downloaded_days`,
        `prerelease_only` or `keep_newest >= 1` is required.
      properties:
        older_than_days:
          type: integer
          minimum: 1
          maximum: 36500
          description: Published more than N days ago
        not_downloaded_days:
          type: integer
          minimum: 1
          maximum: 36500
          description: Not downloaded for N days (never-downloaded versions count from publication)
        keep_newest: { type: integer, minimum: 0, maximum: 100000, description: Versions kept per package }
        keep_matching:
          type: array
          description: Version/tag globs never deleted (e.g. `release-*`, `latest`)
          maxItems: 100
          items: { type: string }
        version_include:
          type: string
          description: RE2 regular expression; only matching versions are in scope
        version_exclude:
          type: string
          description: RE2 regular expression; matching versions are never deleted
        prerelease_only:
          type: boolean
          description: |
            Only pre-release / snapshot versions: Maven `-SNAPSHOT` and unstable
            qualifiers, PEP 440 pre/dev releases for PyPI, SemVer pre-release
            identifiers otherwise
        min_size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Only versions at least this large (sum of their assets)
    CleanupPolicyInput:
      type: object
      required: [name, criteria]
      properties:
        name: { $ref: "#/components/schemas/RepositoryName" }
        description: { type: string, maxLength: 1000 }
        format:
          oneOf:
            - $ref: "#/components/schemas/Format"
            - type: "null"
        criteria: { $ref: "#/components/schemas/CleanupCriteria" }
        repositories:
          type: array
          description: |
            Hosted or proxy repositories attached by the policy. The policy
            also applies to repositories whose `config.cleanup_policies` names it.
          items: { type: string }
        schedule:
          type: [string, "null"]
          description: 5-field cron in UTC (or @daily, @hourly, ...); null = manual only
        enabled:
          type: boolean
          description: Optional; true when omitted. A disabled policy does not run on its schedule.
        preview_token:
          type: string
          description: From a preview of identical name, format, criteria and repositories; required to save them
    CleanupPolicy:
      type: object
      required: [id, name, description, format, criteria, repositories, effective_repositories, schedule,
        schedule_text, enabled, task_id, next_run_at, last_run, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        format:
          oneOf:
            - $ref: "#/components/schemas/Format"
            - type: "null"
        criteria: { $ref: "#/components/schemas/CleanupCriteria" }
        repositories:
          type: array
          items: { type: string }
        effective_repositories:
          type: array
          description: Repositories the policy cleans (attached plus those naming it in their config)
          items: { type: string }
        schedule: { type: [string, "null"] }
        schedule_text:
          type: string
          description: Human form of the schedule, e.g. "Every day at 02:00 UTC"
        enabled: { type: boolean }
        task_id:
          type: string
          description: The policy's task (`cleanup/<name>`) in /tasks
        next_run_at: { type: [string, "null"], format: date-time }
        last_run:
          oneOf:
            - $ref: "#/components/schemas/TaskRun"
            - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    CleanupPolicyPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CleanupPolicy" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    CleanupCandidate:
      type: object
      required: [id, repository, format, namespace, name, version, size_bytes, created_at, published_at, last_downloaded_at,
        download_count]
      properties:
        id: { type: string }
        repository: { type: string }
        format: { type: string }
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        size_bytes: { $ref: "#/components/schemas/Bytes" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        published_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: Same as created_at (the name PublishedComponent uses)
        last_downloaded_at: { type: [string, "null"], format: date-time }
        download_count: { type: integer }
    CleanupRepositorySummary:
      type: object
      required: [repository, component_count, bytes]
      properties:
        repository: { type: string }
        component_count: { type: integer }
        bytes: { $ref: "#/components/schemas/Bytes" }
    CleanupPreview:
      type: object
      required: [component_count, bytes, held_count, repositories, sample, truncated, evaluated_at, preview_token, expires_at]
      properties:
        component_count: { type: integer }
        bytes:
          allOf: [{ $ref: "#/components/schemas/Bytes" }]
          description: Sum of the candidates' asset sizes (shared blobs are freed only when no other asset uses them)
        held_count:
          type: integer
          description: Versions that match but are kept for quarantine or legal hold
        repositories:
          type: array
          items: { $ref: "#/components/schemas/CleanupRepositorySummary" }
        sample:
          type: array
          description: The first candidates by repository and package; the CSV export lists all
          items: { $ref: "#/components/schemas/CleanupCandidate" }
        truncated: { type: boolean }
        evaluated_at: { $ref: "#/components/schemas/Timestamp" }
        preview_token: { type: string }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    CleanupRunResult:
      type: object
      description: TaskRun.result of a cleanup run
      properties:
        policy: { type: string }
        evaluated_at: { $ref: "#/components/schemas/Timestamp" }
        deleted: { type: integer }
        bytes: { $ref: "#/components/schemas/Bytes" }
        failed: { type: integer }
        gone: { type: integer, description: Candidates deleted by someone else during the run }
        held: { type: integer }
        repositories:
          type: array
          items: { $ref: "#/components/schemas/CleanupRepositorySummary" }

    # ------------------------------------------------------------ tasks
    TaskType:
      type: string
      description: |
        Types this server runs: cleanup (cleanup policies), blob_compaction,
        docker_gc, docker_upload_cleanup (ends abandoned docker uploads),
        auth_purge, audit_partitions, rescan (vulnerability rescan against
        new advisories), repository_import (copy packages from another
        registry into a hosted repository, config ImportTaskConfig) and
        proxy_prewarm (fill a proxy or group cache, config
        PrewarmTaskConfig). The others are reserved for planned task types;
        the server refuses to create them.
      enum: [cleanup, blob_compaction, docker_gc, docker_upload_cleanup, auth_purge, audit_partitions, rescan, reindex,
        directory_sync, db_backup, replication, proxy_metadata_refresh, blob_store_move, repository_import, proxy_prewarm]
    ImportSource:
      type: object
      required: [url]
      description: |
        A registry to read from, by the URL its clients use: npm registry,
        NuGet V3 service index (or V2 feed), Maven repository root, PyPI
        simple index, GOPROXY, Cargo sparse index (`sparse+` optional), Helm
        repository, OCI registry root, Debian archive root, RPM repository
        (the directory holding repodata/) or a base URL of raw files. The URL
        must pass the outbound address policy of proxy remotes.
      properties:
        url: { type: string, format: uri }
        username: { type: string }
        password:
          type: string
          writeOnly: true
          description: Sealed at rest; never returned. Leave empty on update to keep the stored one.
        token:
          type: string
          writeOnly: true
          description: Bearer token instead of a password. Sealed at rest; never returned.
    ImportFilters:
      type: object
      properties:
        packages:
          type: array
          items: { type: string }
          description: |
            Names or glob patterns (`*`, `?`, case-insensitive). Exact names are
            read directly; patterns and an empty list need a source that lists
            its packages (npm `/-/all` or `/-/v1/search`, NuGet search, PyPI
            simple index, Cargo API search, Helm index, OCI catalog, Debian and
            RPM metadata, Maven and raw directory listings; Go cannot list).
            Maven names are `groupId:artifactId`.
        exclude: { type: array, items: { type: string } }
        versions:
          type: string
          description: A range (`>=1.2 <2`, `^1.4`, `~1.2`, `~=2.1`, joined with `||`) or glob patterns (`1.*`, `v2.*`). Empty means all.
        latest: { type: integer, minimum: 0, description: Keep the newest N versions of each package (0 = all) }
        prereleases: { type: boolean, description: Include pre-releases (excluded by default) }
    ImportTuning:
      type: object
      properties:
        requests_per_second: { type: number, minimum: 0, maximum: 1000, description: Requests to the source per second (default 10) }
        concurrency: { type: integer, minimum: 0, maximum: 16, description: Packages or coordinates handled at once (default 4) }
    ImportTaskConfig:
      description: |
        Config of a repository_import task. Every version selected is copied
        with the format's own publish protocol, so it goes through the same
        checks as a client upload. Versions already present with identical
        content are skipped; present with other content they are reported as
        conflicts and left alone. The source's publish date becomes the
        version's date where the source has one (npm time, NuGet published,
        Helm created, Go .info Time, PyPI upload-time, Maven and raw
        Last-Modified, RPM file time); yanked, unlisted and dist-tag state is
        carried over (PyPI, Cargo, NuGet, npm). Runs resume from a checkpoint.
      allOf:
        - $ref: "#/components/schemas/ImportFilters"
        - $ref: "#/components/schemas/ImportTuning"
        - type: object
          required: [repository, source]
          properties:
            repository: { type: string, description: The hosted repository to import into }
            source: { $ref: "#/components/schemas/ImportSource" }
            distribution: { type: string, description: "apt: suite to read and upload to (default stable)" }
            components: { type: array, items: { type: string }, description: "apt: archive areas (default main)" }
            architectures: { type: array, items: { type: string }, description: "apt: architectures (default amd64)" }
            files:
              type: array
              items: { type: string }
              description: "raw: paths relative to the source URL; a path ending in / is a directory, crawled through its listing"
    PrewarmTaskConfig:
      description: |
        Config of a proxy_prewarm task: every coordinate is fetched through
        the proxy (or group) as a client would, so the cache holds it.
        Notation per format: `name@version` (npm, NuGet, Cargo, Helm, Go;
        `module@version/go.mod` fetches only the go.mod), `name==version`
        (PyPI), `groupId:artifactId[:extension[:classifier]]:version` (Maven),
        `image:tag` or `image@sha256:...` (Docker, every platform), a path
        (raw, apt, rpm).
      allOf:
        - $ref: "#/components/schemas/ImportTuning"
        - type: object
          required: [repository]
          properties:
            repository: { type: string, description: The proxy or group repository to fill }
            coordinates: { type: array, maxItems: 100000, items: { type: string } }
            lockfiles:
              type: array
              description: Read when the task is saved and replaced by the coordinates they pin (content is not stored)
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  content: { type: string, writeOnly: true }
                  entries: { type: integer, readOnly: true }
                  skipped: { type: integer, readOnly: true }
            inventory:
              description: List what a source registry holds and fetch all of it
              allOf:
                - $ref: "#/components/schemas/ImportFilters"
                - type: object
                  required: [source]
                  properties:
                    source: { $ref: "#/components/schemas/ImportSource" }
                    distribution: { type: string }
                    components: { type: array, items: { type: string } }
                    architectures: { type: array, items: { type: string } }
    ImportRunResult:
      type: object
      description: TaskRun.result of a repository_import run
      properties:
        packages: { type: integer }
        packages_done: { type: integer }
        imported: { type: integer, description: Versions copied }
        skipped: { type: integer, description: Versions already present with identical content }
        conflicts: { type: integer, description: Versions present with other content (left as they are) }
        failed: { type: integer }
        bytes: { $ref: "#/components/schemas/Bytes" }
        conflict_items: { type: array, items: { type: string }, description: The first 100 }
        failed_items: { type: array, items: { type: string }, description: The first 100, with the reason }
    PrewarmRunResult:
      type: object
      description: TaskRun.result of a proxy_prewarm run
      properties:
        coordinates: { type: integer }
        done: { type: integer }
        cached: { type: integer, description: Coordinates fetched through the proxy (now in its cache) }
        failed: { type: integer }
        skipped:
          type: integer
          description: Coordinates a routing rule of the repository keeps from its remote or member, and lockfile entries left out (workspace, path, git, link)
        bytes: { $ref: "#/components/schemas/Bytes" }
        failed_items: { type: array, items: { type: string } }
        skipped_items: { type: array, items: { type: string }, description: The first 100 routing exclusions, with the rule }
    LockfileResult:
      type: object
      required: [kind, coordinates, skipped]
      properties:
        kind: { type: string, description: The parser used, e.g. package-lock.json or list }
        coordinates: { type: array, items: { type: string } }
        skipped: { type: integer }
    TaskRunStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    TaskInput:
      type: object
      required: [name, type]
      properties:
        name: { $ref: "#/components/schemas/RepositoryName" }
        type: { $ref: "#/components/schemas/TaskType" }
        description: { type: string, maxLength: 1000 }
        schedule: { type: [string, "null"], description: 5-field cron in UTC (or @daily, ...); null = manual only }
        config:
          type: object
          additionalProperties: true
          description: |
            Per type. blob_compaction: `blob_store` (name; default all),
            `orphan_scan` (bool). docker_gc: `older_than_days` (default 7),
            `repositories` (default all hosted and proxy docker repositories),
            `dry_run`. repository_import: ImportTaskConfig. proxy_prewarm:
            PrewarmTaskConfig. Others take none. Creating or changing an import
            or pre-warm task, and running it by hand, also needs
            `repo:<repository>:write` on its repository.
        enabled:
          type: boolean
          description: Optional; true when omitted
    TaskRun:
      type: object
      required: [id, task_id, task_name, task_type, status, progress, message, triggered_by, node, cancel_requested,
        created_at, started_at, finished_at]
      properties:
        id: { type: string }
        task_id: { type: string }
        task_name: { type: string }
        task_type: { $ref: "#/components/schemas/TaskType" }
        status: { $ref: "#/components/schemas/TaskRunStatus" }
        progress: { type: number, minimum: 0, maximum: 1 }
        message: { type: string }
        triggered_by:
          type: string
          description: Principal name, or `schedule`
        node:
          type: string
          description: Host name of the node executing (or that last executed) the run
        cancel_requested: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        components_deleted:
          type: integer
          description: Cleanup runs - components deleted so far (from the result)
        bytes_freed:
          allOf: [{ $ref: "#/components/schemas/Bytes" }]
          description: Cleanup, docker GC and blob compaction runs - bytes released (from the result)
        result:
          type: object
          additionalProperties: true
          description: |
            Summary of a finished run, per type (cleanup runs - CleanupRunResult,
            repository_import - ImportRunResult, proxy_prewarm - PrewarmRunResult)
    TaskRunLogLine:
      type: object
      required: [seq, at, level, message]
      properties:
        seq: { type: integer, description: Line number within the stored log }
        at: { $ref: "#/components/schemas/Timestamp" }
        level: { type: string, enum: [debug, info, warn, error] }
        message: { type: string }
    TaskRunLog:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TaskRunLogLine" }
        truncated:
          type: boolean
          description: Older lines were dropped (the log keeps its newest 256 KiB)
    Task:
      type: object
      required: [id, name, type, description, schedule, schedule_text, config, enabled, builtin, next_run_at, last_run,
        created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/TaskType" }
        description: { type: string }
        schedule: { type: [string, "null"] }
        schedule_text: { type: string }
        config:
          type: object
          additionalProperties: true
        enabled: { type: boolean }
        builtin:
          type: boolean
          description: Provided by the server; can be edited and disabled, not deleted
        policy_id:
          type: string
          description: Set for the task of a cleanup policy
        last_run:
          oneOf:
            - $ref: "#/components/schemas/TaskRun"
            - type: "null"
        next_run_at: { type: [string, "null"], format: date-time }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    TaskList:
      type: object
      required: [items, running]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        running:
          type: array
          description: Queued and running runs ("Running now" banner)
          items: { $ref: "#/components/schemas/TaskRun" }
    TaskRunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TaskRun" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    # ------------------------------------------------------------ access
    Privilege:
      type: string
      pattern: "^(repo|system):[^:]+:(read|write|delete|admin|\\*)$|^system:\\*$"
      examples: ["repo:*:read", "repo:npm-*:write", "system:users:admin", "system:*"]
    Member:
      type: object
      required: [id, username, kind, display_name, source, roles, token_count]
      properties:
        id: { type: string }
        username: { type: string }
        kind: { type: string, enum: [user, service_account] }
        display_name: { type: string }
        email: { type: [string, "null"] }
        avatar_url: { type: [string, "null"] }
        source: { type: string, enum: [local, oidc, ldap, saml] }
        roles:
          type: array
          items: { type: string }
        token_count:
          type: integer
          description: Live (unrevoked, unexpired) personal or service-account tokens
        disabled: { type: boolean }
        locked_until: { type: [string, "null"], format: date-time }
        last_active_at: { type: [string, "null"], format: date-time }
        description:
          type: string
          description: Free-text note, mostly for service accounts
        password_set:
          type: boolean
          description: Whether the user has a local password
        must_change_password:
          type: boolean
          description: The user has to set a new password before doing anything else
        created_at: { $ref: "#/components/schemas/Timestamp" }
    MemberInput:
      type: object
      required: [username, kind]
      properties:
        username: { type: string }
        kind: { type: string, enum: [user, service_account] }
        display_name: { type: string }
        email: { type: string }
        description:
          type: string
          maxLength: 1000
        password:
          type: string
          writeOnly: true
          description: |
            Local users only. To change your own password use `PUT /me/password`,
            for others prefer `PUT /users/{id}/password`.
        roles:
          type: array
          items: { type: string }
        disabled: { type: boolean }
    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    GroupMapping:
      type: object
      required: [provider, group]
      properties:
        provider: { type: string }
        group: { type: string }
    RoleInput:
      type: object
      required: [name, privileges]
      properties:
        name: { type: string }
        description: { type: string }
        privileges:
          type: array
          items: { $ref: "#/components/schemas/Privilege" }
        group_mappings:
          type: array
          description: External (OIDC/LDAP/SAML) groups granted this role
          items: { $ref: "#/components/schemas/GroupMapping" }
    Role:
      allOf:
        - $ref: "#/components/schemas/RoleInput"
        - type: object
          required: [id, builtin, member_count]
          properties:
            id: { type: string }
            builtin: { type: boolean }
            member_count: { type: integer }
    IdentityProvider:
      type: object
      required: [name, kind, enabled, state]
      properties:
        name: { type: string }
        kind: { type: string, enum: [oidc, ldap, saml] }
        enabled: { type: boolean }
        state: { type: string, enum: [ok, error, disabled] }
        last_sync_at: { type: [string, "null"], format: date-time }
        error: { type: string }
    # ------------------------------------------------------------ settings
    SettingsMeta:
      type: object
      required: [source, file_fields, updated_at]
      properties:
        source:
          type: string
          enum: [file, database, default]
          description: "`file`: hangar.yaml or HANGAR_* (read-only); `database`: saved here; `default`: never saved"
        file_fields:
          type: array
          items: { type: string }
          description: Fields the configuration file sets; shown read-only
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: string }
    GroupRole:
      type: object
      required: [group, roles]
      properties:
        group:
          type: string
          description: Group name (case-insensitive, a leading "/" optional); for LDAP also a group DN
        roles:
          type: array
          items: { type: string }
    RoleMappingSettings:
      type: object
      required: [group_roles, default_roles, allowed_groups, auto_create]
      properties:
        group_roles:
          type: array
          items: { $ref: "#/components/schemas/GroupRole" }
        default_roles:
          type: array
          items: { type: string }
          description: Granted to every user of the provider
        allowed_groups:
          type: array
          items: { type: string }
          description: When not empty, only members of these groups may sign in
        auto_create:
          type: boolean
          description: Create users on their first sign-in
    OIDCSettings:
      allOf:
        - $ref: "#/components/schemas/RoleMappingSettings"
        - type: object
          required: [enabled, issuer_url, client_id, client_auth, display_name, scopes, username_claim, email_claim, name_claim, groups_claim, ca_pem]
          properties:
            enabled: { type: boolean }
            issuer_url: { type: string, description: "Issuer identifier; https (http for localhost only)" }
            client_id: { type: string }
            client_auth: { type: string, enum: [basic, post] }
            logout:
              type: string
              enum: [provider, local]
              description: >-
                provider (default): signing out also ends the provider session when it
                has an end_session_endpoint (RP-Initiated Logout); local: Hangar only
            display_name: { type: string, maxLength: 64, description: Label of the sign-in button }
            scopes:
              type: array
              items: { type: string }
              description: Must include openid
            username_claim: { type: string }
            email_claim: { type: string }
            name_claim: { type: string }
            groups_claim: { type: string, description: 'A dotted path reaches nested claims ("realm_access.roles")' }
            ca_pem: { type: string, description: PEM certificates trusted for the provider }
            preset:
              type: string
              maxLength: 32
              pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
              description: >-
                Provider template the settings page filled the form from (keycloak, entra-id, google, okta, other);
                informational, empty when unknown or set in the configuration file. Omitted on PUT clears it.
    OIDCSettingsInput:
      allOf:
        - $ref: "#/components/schemas/OIDCSettings"
        - type: object
          properties:
            client_secret:
              type: string
              writeOnly: true
              description: New secret; empty keeps the stored one
            clear_client_secret: { type: boolean }
    OIDCProviderSettings:
      allOf:
        - $ref: "#/components/schemas/OIDCSettings"
        - $ref: "#/components/schemas/SettingsMeta"
        - type: object
          required: [client_secret_configured, redirect_uri]
          properties:
            client_secret_configured: { type: boolean }
            ca_file: { type: string, description: auth.oidc.ca_file of a provider set in the file }
            redirect_uri:
              type: string
              description: Callback URL to register at the provider (`<base_url>/api/v1/auth/oidc/callback`)
    LDAPSettings:
      allOf:
        - $ref: "#/components/schemas/RoleMappingSettings"
        - type: object
          required: [enabled, url, start_tls, ca_pem, bind_dn, user_base_dn, user_filter, username_attribute, email_attribute,
            name_attribute, group_attribute, group_base_dn, group_filter, group_name_attribute, nested_groups]
          properties:
            enabled: { type: boolean }
            url: { type: string, description: "ldap://host[:port] or ldaps://host[:port]" }
            start_tls: { type: boolean }
            ca_pem: { type: string }
            bind_dn: { type: string, description: Service account; empty for anonymous search }
            user_base_dn: { type: string }
            user_filter: { type: string, description: "Must contain {username}" }
            username_attribute: { type: string }
            email_attribute: { type: string }
            name_attribute: { type: string }
            group_attribute: { type: string, description: Read from the user entry unless group_base_dn is set }
            group_base_dn: { type: string }
            group_filter: { type: string, description: "{dn} is the user's DN, {username} the login name" }
            group_name_attribute: { type: string }
            nested_groups: { type: boolean, description: Active Directory nested groups; needs group_base_dn }
            preset:
              type: string
              maxLength: 32
              pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
              description: >-
                Directory template the settings page filled the form from (active-directory, openldap, freeipa, other);
                informational, empty when unknown or set in the configuration file. Omitted on PUT clears it.
    LDAPSettingsInput:
      allOf:
        - $ref: "#/components/schemas/LDAPSettings"
        - type: object
          properties:
            bind_password:
              type: string
              writeOnly: true
              description: New password; empty keeps the stored one
            clear_bind_password: { type: boolean }
    LDAPProviderSettings:
      allOf:
        - $ref: "#/components/schemas/LDAPSettings"
        - $ref: "#/components/schemas/SettingsMeta"
        - type: object
          required: [bind_password_configured]
          properties:
            bind_password_configured: { type: boolean }
            ca_file: { type: string }
    SettingsTestStep:
      type: object
      required: [name, status, message, latency_ms]
      properties:
        name: { type: string, description: "e.g. discovery, issuer, keys, client_credentials, connect, bind, lookup, request" }
        status: { type: string, enum: [ok, failed, skipped] }
        message: { type: string }
        latency_ms: { type: integer }
    SettingsTestResult:
      type: object
      required: [ok, message, steps, latency_ms]
      properties:
        ok: { type: boolean }
        message: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/SettingsTestStep" }
        status_code: { type: integer, description: HTTP status of the proxy test request }
        latency_ms: { type: integer }
        user:
          type: object
          description: The entry an LDAP test found
          required: [dn, username, email, display_name, groups, roles]
          properties:
            dn: { type: string }
            username: { type: string }
            email: { type: string }
            display_name: { type: string }
            groups:
              type: array
              items: { type: string }
            roles:
              type: array
              items: { type: string }
              description: Roles the provider's mapping grants
    OutboundProxySettings:
      type: object
      required: [scheme, host, port, username, no_proxy, redirect_hosts, ca_pem, default]
      properties:
        scheme: { type: string, enum: [http, https], description: How Hangar talks to the proxy }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        no_proxy:
          type: array
          items: { type: string }
          description: Hosts, domain suffixes (.corp.example), IPs and CIDRs reached directly
        redirect_hosts:
          type: array
          items: { type: string }
          description: |
            Hosts upstream redirects may lead to and still use this proxy (a
            registry's CDN). When not empty, only the repository's remote host and
            these hosts go through the proxy. Empty: every host does.
        ca_pem: { type: string, description: PEM certificates trusted for requests through this proxy }
        default: { type: boolean, description: The platform default; at most one proxy }
    OutboundProxyInput:
      allOf:
        - $ref: "#/components/schemas/OutboundProxySettings"
        - type: object
          properties:
            name:
              type: string
              pattern: "^[a-z0-9][a-z0-9._-]{0,62}$"
              description: Required on create; cannot change
            password:
              type: string
              writeOnly: true
              description: New password; empty keeps the stored one
            clear_password: { type: boolean }
    OutboundProxy:
      allOf:
        - $ref: "#/components/schemas/OutboundProxySettings"
        - type: object
          required: [name, password_configured, source, file_fields, repositories, inheriting, created_at, updated_at]
          properties:
            name: { type: string }
            password_configured: { type: boolean }
            source: { type: string, enum: [file, database] }
            file_fields:
              type: array
              items: { type: string }
            repositories: { type: integer, description: Proxy repositories that select this proxy by name }
            inheriting: { type: integer, description: Proxy repositories that use the platform default (default proxy only) }
            created_at: { type: [string, "null"], format: date-time }
            updated_at: { type: [string, "null"], format: date-time }
            updated_by: { type: string }
    OutboundProxyList:
      type: object
      required: [items, default, limited]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OutboundProxy" }
        default: { type: string, description: Name of the platform default proxy; empty when none }
        environment_proxy:
          type: string
          description: HTTPS_PROXY of the server (password masked), used when there is no default
        ca_file: { type: string, description: http.ca_file, trusted for every request }
        limited: { type: boolean, description: Items carry names only (caller cannot read settings) }
    TokenInput:
      type: object
      required: [name, scopes, expires_at]
      properties:
        name: { type: string }
        owner:
          type: string
          description: Service account name; default the caller
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Privilege" }
        expires_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: Required; tokens never live forever
        allowed_cidrs:
          type: array
          maxItems: 32
          description: |
            Optional: the token only works from these client addresses or CIDR
            networks (`203.0.113.7`, `10.20.0.0/16`, `2001:db8::/48`). Requests
            from elsewhere fail authentication (audited as `address_not_allowed`).
          items: { type: string }
        read_only:
          type: boolean
          description: |
            Optional: the token can only read. Its scopes are narrowed to read and
            the REST API refuses every request other than GET and HEAD
            (403 `read_only_token`).
    TokenRotateInput:
      type: object
      properties:
        revoke_old_after:
          type: [string, "null"]
          description: |
            Go duration from 0s to 720h. `0s` revokes the old token now; `24h` lets
            it work one more day. Omit or null to leave it as it is.
          examples: ["0s", "24h"]
    TokenRotated:
      allOf:
        - $ref: "#/components/schemas/TokenCreated"
        - type: object
          required: [replaced]
          properties:
            replaced:
              type: object
              required: [id, revoked, expires_at]
              properties:
                id: { type: string }
                revoked: { type: boolean, description: Revoked at once }
                expires_at:
                  allOf: [{ $ref: "#/components/schemas/Timestamp" }]
                  description: When the old token stops working (now, if revoked)
    Token:
      type: object
      required: [id, name, owner, prefix, scopes, expires_at, created_at, allowed_cidrs, read_only]
      properties:
        id: { type: string }
        name: { type: string }
        owner: { type: string }
        owner_kind: { type: string, enum: [user, service_account] }
        last_used_ip:
          type: [string, "null"]
          description: Client address of the latest use
        prefix:
          type: string
          description: First characters of the secret, for recognition (`hgr_1a2b`)
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Privilege" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { type: [string, "null"], format: date-time }
        allowed_cidrs:
          type: array
          description: Client networks the token works from; empty means any
          items: { type: string }
        read_only: { type: boolean, description: The token can only read }
    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The token (`hgr_...`). Shown once; store it now.
    TokenPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Token" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    ProfileInput:
      type: object
      properties:
        display_name: { type: string, maxLength: 200 }
        email: { type: string, description: Empty clears it }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password, writeOnly: true }
        new_password: { type: string, format: password, writeOnly: true }
    PasswordReset:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, writeOnly: true }
    SessionInfo:
      type: object
      required: [id, created_at, last_seen_at, expires_at, ip, user_agent, remember, current]
      properties:
        id: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_seen_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: Updated at most once a minute
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        ip: { type: [string, "null"] }
        user_agent: { type: string }
        remember: { type: boolean }
        current:
          type: boolean
          description: The session making this request
    SessionInfoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionInfo" }
    SessionsEnded:
      type: object
      required: [ended]
      properties:
        ended: { type: integer }
    RoleMemberInput:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
    Action:
      type: string
      enum: [read, write, delete, admin]
    PermissionGrant:
      type: object
      required: [action, source]
      properties:
        action: { $ref: "#/components/schemas/Action" }
        source:
          type: string
          enum: [role, anonymous]
          description: "`role`: a privilege of one of the user's roles; `anonymous`: the repository allows anonymous read"
        role: { type: string }
        privilege: { $ref: "#/components/schemas/Privilege" }
    ResourcePermissions:
      type: object
      required: [resource, name, actions, grants]
      properties:
        resource:
          type: string
          examples: ["repo:npm-hosted", "system:audit"]
        name: { type: string }
        format: { type: string, description: Repositories only }
        type: { type: string, description: Repositories only }
        anonymous_read: { type: boolean }
        actions:
          type: array
          items: { $ref: "#/components/schemas/Action" }
        grants:
          type: array
          items: { $ref: "#/components/schemas/PermissionGrant" }
    RoleGrant:
      type: object
      required: [name, builtin, privileges]
      properties:
        name: { type: string }
        builtin: { type: boolean }
        privileges:
          type: array
          items: { $ref: "#/components/schemas/Privilege" }
    EffectivePermissions:
      type: object
      required: [user_id, username, kind, disabled, locked, roles, repositories, system, notes]
      properties:
        user_id: { type: string }
        username: { type: string }
        kind: { type: string, enum: [user, service_account] }
        disabled:
          type: boolean
          description: A disabled account can do nothing now; the lists show what applies once enabled
        locked: { type: boolean }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleGrant" }
        repositories:
          type: array
          description: Repositories with at least one allowed action, by name
          items: { $ref: "#/components/schemas/ResourcePermissions" }
        system:
          type: array
          items: { $ref: "#/components/schemas/ResourcePermissions" }
        notes:
          type: array
          description: What the report cannot show (group-mapped roles, token scopes)
          items: { type: string }

    # ------------------------------------------------------------ audit
    AuditEvent:
      type: object
      required: [id, at, actor, action, target, outcome]
      properties:
        id: { type: integer, format: int64 }
        at: { $ref: "#/components/schemas/Timestamp" }
        actor: { type: string }
        action:
          type: string
          examples: ["repository.create", "component.delete", "auth.login.failed"]
        target: { type: string, examples: ["repo:npm-hosted"] }
        outcome: { type: string, enum: [success, denied, error] }
        ip: { type: [string, "null"] }
        details:
          type: object
          additionalProperties: true
    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    # ------------------------------------------------------------ cluster
    Node:
      type: object
      required: [id, name, role, address, healthy, last_heartbeat]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [leader, follower, edge] }
        zone: { type: string }
        address: { type: string }
        version: { type: string }
        healthy: { type: boolean }
        cpu_pct: { type: number }
        memory_pct: { type: number }
        cache_disk_pct: { type: number }
        requests_per_second: { type: number }
        uptime_seconds: { type: integer }
        last_heartbeat: { $ref: "#/components/schemas/Timestamp" }
    ClusterStatus:
      type: object
      required: [state, quorum, nodes, dependencies]
      properties:
        state: { type: string, enum: [ok, degraded, down] }
        quorum: { type: boolean }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/Node" }
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/DependencyStatus" }
    ReplicationTargetInput:
      type: object
      required: [name, url, repositories]
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        kind: { type: string, enum: [edge, dr], default: edge }
        repositories:
          type: array
          description: Repository name patterns
          items: { type: string }
        enabled: { type: boolean, default: true }
    ReplicationTarget:
      allOf:
        - $ref: "#/components/schemas/ReplicationTargetInput"
        - type: object
          required: [id, state, objects_today]
          properties:
            id: { type: string }
            state: { type: string, enum: [in_sync, lagging, failing, disabled] }
            lag_seconds: { type: [integer, "null"] }
            objects_today: { type: integer }
            last_error: { type: [string, "null"] }
            retry_at: { type: [string, "null"], format: date-time }

    # ------------------------------------------------------------ events
    LiveEvent:
      description: One SSE message; `type` is the SSE `event:` field, `data` its JSON payload.
      oneOf:
        - type: object
          required: [type, data]
          properties:
            type: { const: component.published }
            data: { $ref: "#/components/schemas/PublishedComponent" }
        - type: object
          required: [type, data]
          properties:
            type: { const: component.quarantined }
            data:
              type: object
              required: [id, name, version]
              properties:
                id: { type: string }
                name: { type: string }
                version: { type: string }
                repository: { type: string }
                reason: { type: string }
        - type: object
          required: [type, data]
          properties:
            type: { const: component.deleted }
            data:
              type: object
              required: [id]
              properties:
                id: { type: string }
                repository: { type: string }
        - type: object
          required: [type, data]
          properties:
            type: { const: task.progress }
            data:
              type: object
              required: [task_id, run_id, progress]
              properties:
                task_id: { type: string }
                run_id: { type: string }
                task_name: { type: string }
                status: { $ref: "#/components/schemas/TaskRunStatus" }
                progress: { type: number, minimum: 0, maximum: 1 }
                message: { type: string }
        - type: object
          required: [type, data]
          properties:
            type: { const: task.finished }
            data: { $ref: "#/components/schemas/TaskRun" }
        - type: object
          required: [type, data]
          properties:
            type: { const: upstream.status }
            data:
              type: object
              description: A proxy remote changed state; latency is not included (see /upstreams/health)
              required: [name, url, state]
              properties:
                name:
                  type: string
                  description: Proxy repository name
                url: { type: string }
                state: { $ref: "#/components/schemas/UpstreamState" }
                previous: { $ref: "#/components/schemas/UpstreamState" }
      discriminator:
        propertyName: type
