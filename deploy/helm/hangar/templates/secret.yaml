{{- /*
The chart's own Secret, holding only what no existingSecret provides. Generated
values (docker token key) are kept across upgrades with helm lookup.
*/ -}}
{{- $data := dict -}}
{{- if and .Values.database.url (not .Values.database.existingSecret) -}}
{{- $_ := set $data .Values.database.existingSecretKey .Values.database.url -}}
{{- end -}}
{{- if and .Values.storage.s3.accessKeyID (not .Values.storage.s3.existingSecret) -}}
{{- $_ := set $data .Values.storage.s3.accessKeyIDKey .Values.storage.s3.accessKeyID -}}
{{- $_ := set $data .Values.storage.s3.secretAccessKeyKey .Values.storage.s3.secretAccessKey -}}
{{- end -}}
{{- if not .Values.dockerTokenKey.existingSecret -}}
{{- $key := .Values.dockerTokenKey.value | default (include "hangar.persistentRandom" (list . (include "hangar.secretName" .) .Values.dockerTokenKey.existingSecretKey)) -}}
{{- $_ := set $data .Values.dockerTokenKey.existingSecretKey $key -}}
{{- end -}}
{{- if and .Values.bootstrapAdmin.username (not .Values.bootstrapAdmin.existingSecret) -}}
{{- $_ := set $data .Values.bootstrapAdmin.usernameKey .Values.bootstrapAdmin.username -}}
{{- $_ := set $data .Values.bootstrapAdmin.passwordKey .Values.bootstrapAdmin.password -}}
{{- end -}}
{{- if and .Values.httpProxyPassword.value (not .Values.httpProxyPassword.existingSecret) -}}
{{- $_ := set $data .Values.httpProxyPassword.existingSecretKey .Values.httpProxyPassword.value -}}
{{- end -}}
{{- if and (eq .Values.nats.mode "external") .Values.nats.external.url (not .Values.nats.external.existingSecret) -}}
{{- $_ := set $data .Values.nats.external.existingSecretKey .Values.nats.external.url -}}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hangar.secretName" . }}
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
{{- end }}
