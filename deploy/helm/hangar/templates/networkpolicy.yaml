{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hangar.fullname" . }}
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hangar.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
        {{- range .Values.service.connectorPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.networkPolicy.ingressFrom }}
    # The other Hangar pods read this pod's System logs
    # (POST /internal/v1/system/logs, signed with the secret key).
    - ports:
        - port: http
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "hangar.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- if .Values.tests.enabled }}
    # The chart's `helm test` pod (tests/test-readyz.yaml) calls /readyz.
    - ports:
        - port: http
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "hangar.testSelectorLabels" . | nindent 14 }}
    {{- end }}
    {{- if .Values.imageScanning.enabled }}
    # The scan adapter pulls the images to scan.
    - ports:
        - port: http
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "hangar.scannerSelectorLabels" . | nindent 14 }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The System logs of the other Hangar pods.
    - to:
        - podSelector:
            matchLabels:
              {{- include "hangar.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- if .Values.imageScanning.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "hangar.trivySelectorLabels" . | nindent 14 }}
      ports:
        - port: 4954
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "hangar.scannerSelectorLabels" . | nindent 14 }}
      ports:
        - port: 4955
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.to }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
