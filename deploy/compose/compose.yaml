# Hangar on one host: Hangar, PostgreSQL 16 and, optionally, Caddy for
# automatic TLS. install.sh installs this file into the data directory and
# manages everything around it; see docs/deploy/install-compose.md.
#
# Layout of the data directory (this file's directory):
#
#   compose.yaml        this file (replaced on upgrade)
#   .env                installer settings: image, port, URL (no secrets;
#                       written by install.sh, do not edit)
#   config/hangar.yaml  server settings (yours; kept on upgrade)
#   secrets/            one file per secret, mode 600 (generated once)
#   postgres/           PostgreSQL data
#   blobs/              package files
#   nats/               job queue state
#   caddy/              certificates and Caddyfile (with --tls caddy)
#
# Everything is a bind mount of a sub-directory: back up the directory and
# you have backed up Hangar. :Z / :z relabel the directories for SELinux
# (ignored on hosts without it).

name: hangar

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging: *logging

networks:
  hangar:
    ipam:
      config:
        # Fixed so that Hangar can trust X-Forwarded-* from Caddy (and the
        # Docker gateway) in this range and nowhere else.
        - subnet: ${HANGAR_NETWORK_SUBNET:-172.30.80.0/24}

services:
  hangar:
    container_name: hangar
    <<: *hardening
    image: ${HANGAR_IMAGE:?run install.sh, which writes .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: [hangar]
    ports:
      - "${HANGAR_BIND_ADDR:-127.0.0.1}:${HANGAR_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./config
        target: /etc/hangar
        read_only: true
        bind: { create_host_path: false, selinux: Z }
      # Read-write: the server removes initial-admin-password after the
      # first password change. Shared label: postgres reads one file here.
      - type: bind
        source: ./secrets
        target: /run/secrets/hangar
        bind: { create_host_path: false, selinux: z }
      - type: bind
        source: ./blobs
        target: /var/lib/hangar/blobs
        bind: { create_host_path: false, selinux: Z }
      - type: bind
        source: ./nats
        target: /var/lib/hangar/nats
        bind: { create_host_path: false, selinux: Z }
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    stop_grace_period: 60s
    # Settings tied to this layout. Everything else lives in
    # config/hangar.yaml; secrets are files in secrets/ named after their
    # setting (security.secret_key, database.url, auth.oidc.client_secret).
    environment:
      HANGAR_CONFIG: /etc/hangar/hangar.yaml
      HANGAR_SECRETS_DIR: /run/secrets/hangar
      # Stable node identity across redeploys (System status page).
      HANGAR_SERVER_NODE_ID: hangar-1
      HANGAR_SERVER_BASE_URL: ${HANGAR_BASE_URL:?run install.sh, which writes .env}
      HANGAR_SERVER_TRUSTED_PROXIES: ${HANGAR_TRUSTED_PROXIES:-172.30.80.0/24}
      # Secure cookies need HTTPS; true only for a plain http:// base URL.
      HANGAR_AUTH_SESSION_INSECURE: ${HANGAR_SESSION_INSECURE:-false}
      # A single hangar process applies migrations on start.
      HANGAR_DATABASE_MIGRATE_ON_START: "true"
      HANGAR_STORAGE_FS_PATH: /var/lib/hangar/blobs
      HANGAR_NATS_DATA_DIR: /var/lib/hangar/nats
      # First administrator: install.sh writes the password file; it is
      # removed after the first password change (bootstrap is off then).
      HANGAR_BOOTSTRAP_ADMIN_USER: admin
      HANGAR_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/hangar/initial-admin-password
    healthcheck:
      test: ["CMD", "/usr/local/bin/hangar-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${HANGAR_CPUS:-4}"
          memory: ${HANGAR_MEMORY:-4g}
        reservations:
          memory: 512m

  postgres:
    container_name: hangar-postgres
    <<: *hardening
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine}
    restart: unless-stopped
    networks: [hangar]
    shm_size: 256m
    stop_grace_period: 120s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hangar}
      POSTGRES_DB: ${POSTGRES_DB:-hangar}
      # Read by the entrypoint when it initialises an empty data directory.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --data-checksums
    # Sized for a host with about 8 GB RAM shared with Hangar; scale
    # shared_buffers (~25% of the memory given to PostgreSQL) and
    # effective_cache_size (~75%) together.
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=512MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=2s
      - -c
      - log_lock_waits=on
      - -c
      - log_checkpoints=on
    volumes:
      # Owned by the image's postgres user (uid 70 in the alpine image).
      - type: bind
        source: ./postgres
        target: /var/lib/postgresql/data
        bind: { create_host_path: false, selinux: Z }
      - type: bind
        source: ./secrets/postgres-password
        target: /run/secrets/postgres-password
        read_only: true
        bind: { create_host_path: false, selinux: z }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-2}"
          memory: ${POSTGRES_MEMORY:-3g}

  caddy:
    container_name: hangar-caddy
    <<: *hardening
    profiles: [caddy]
    image: ${CADDY_IMAGE:-caddy:2.11.7-alpine}
    restart: unless-stopped
    networks: [hangar]
    depends_on:
      hangar:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      HANGAR_DOMAIN: ${HANGAR_DOMAIN:-}
      HANGAR_REGISTRY_DOMAIN: ${HANGAR_REGISTRY_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - type: bind
        source: ./caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: { create_host_path: false, selinux: Z }
      # Extra sites (registry host, host connectors): caddy/sites/*.caddy.
      - type: bind
        source: ./caddy/sites
        target: /etc/caddy/sites
        read_only: true
        bind: { create_host_path: false, selinux: Z }
      - type: bind
        source: ./caddy/data
        target: /data
        bind: { create_host_path: false, selinux: Z }
      - type: bind
        source: ./caddy/config
        target: /config
        bind: { create_host_path: false, selinux: Z }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "${CADDY_CPUS:-2}"
          memory: ${CADDY_MEMORY:-512m}
