# Hangar server settings: <data>/config/hangar.yaml, mounted read-only at
# /etc/hangar/hangar.yaml. Yours to edit; the installer never replaces it.
# Restart after a change: docker compose -f <data>/compose.yaml restart hangar
#
# Every key is documented in hangar.example.yaml at the repository root.
# Not here:
#   - secrets: one file each in <data>/secrets, named after the setting
#     (auth.oidc.client_secret, http.proxy_password), mode 600, owner 65532;
#   - server.base_url, server.trusted_proxies, the port and the storage paths:
#     set by the installer (re-run it with --domain, --trusted-proxies, ...).

server:
  addr: ":8080"
  instance_name: hangar
  read_header_timeout: 10s
  idle_timeout: 120s
  # Uploads still running get this long to finish on `docker compose stop`
  # (keep it below stop_grace_period in compose.yaml).
  shutdown_timeout: 45s

log:
  level: info
  format: json

database:
  max_conns: 30
  min_conns: 2
  conn_lifetime: 1h

storage:
  s3:
    # 16 MiB parts; raise for very large artifacts on fast links.
    part_size: 16777216
  gc:
    grace_period: 48h
    batch_size: 100
    temp_max_age: 24h

http:
  use_environment: true
  connect_timeout: 10s
  read_timeout: 60s

metrics:
  enabled: true
  path: /metrics
  # Prometheus sends the token of secrets/metrics.bearer_token (generated by
  # the installer) as "Authorization: Bearer <token>". Setting auth to none
  # opens /metrics to everyone; then delete that file too.
  auth: bearer
