name: Feature request
description: Suggest a capability Hangar does not have yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/ismoilovdevml/hangar/blob/main/docs/ROADMAP.md)
        first: the feature may be planned already. Open questions and ideas
        that are not yet a concrete proposal fit better in Discussions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today? Describe the situation, not the solution.
      placeholder: Our CI publishes to three registries and we cannot ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work (configuration, API, UI, client behaviour).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you use now, and how other registries (Nexus, Artifactory, Harbor, ...) handle it if you know.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you work on it?
      options:
        - "No"
        - Yes, with guidance
        - Yes, I can open a pull request
    validations:
      required: true
