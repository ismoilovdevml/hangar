{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hangar.fullname" . }}
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "hangar.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: {{ dig "metrics" "path" "/metrics" .Values.config }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- if eq .Values.metrics.auth.mode "bearer" }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.metrics.auth.existingSecret }}
          key: {{ .Values.metrics.auth.tokenKey }}
      {{- else if eq .Values.metrics.auth.mode "basic" }}
      basicAuth:
        username:
          name: {{ .Values.metrics.auth.existingSecret }}
          key: {{ .Values.metrics.auth.usernameKey }}
        password:
          name: {{ .Values.metrics.auth.existingSecret }}
          key: {{ .Values.metrics.auth.passwordKey }}
      {{- end }}
{{- end }}
