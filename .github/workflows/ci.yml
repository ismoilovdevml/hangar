name: CI

# Unit tests, lint and builds on every change; the real-client e2e suite
# (all clients in containers, strict), the S3 driver against MinIO, the Helm
# chart and compose checks, and Playwright against the mock build and
# against a real server.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (vet, test)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hangar
          POSTGRES_PASSWORD: hangar
          POSTGRES_DB: hangar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hangar -d hangar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HANGAR_TEST_DATABASE_URL: postgres://hangar:hangar@localhost:5432/hangar_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./cmd/... ./internal/... && go vet -tags e2e ./test/e2e/... && go vet -tags webui ./internal/webui/
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out ./cmd/... ./internal/... ./test/...
      - name: build
        run: make build

  golangci:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./internal/...

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Detect web app
        id: detect
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "web/package.json not found, skipping"; fi
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web ci
      - name: lint
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web run lint
      - name: typecheck
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web run typecheck
      - name: test
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web run test
      - name: build
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web run build

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: [go]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: hangar:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: docker run --rm hangar:ci version
      - name: Build the scan adapter image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/scanner/Dockerfile
          push: false
          load: true
          tags: hangar-scanner:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,scope=scanner,mode=max
      - name: Smoke test the scan adapter image
        run: |
          docker run --rm hangar-scanner:ci version
          docker run --rm --entrypoint trivy hangar-scanner:ci --version

  deploy:
    name: Helm chart, compose and installer (make deploy-check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: make deploy-check
        run: make deploy-check

  playwright-mock:
    name: Playwright (mock build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright against the MSW build
        working-directory: web
        env:
          CI: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-mock-report
          path: web/playwright-report
          retention-days: 7

  playwright-live:
    name: Playwright (real server)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hangar
          POSTGRES_PASSWORD: hangar
          POSTGRES_DB: hangar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hangar -d hangar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HANGAR_SERVER_ADDR: 127.0.0.1:8080
      HANGAR_SERVER_BASE_URL: http://localhost:8080
      HANGAR_DATABASE_URL: postgres://hangar:hangar@localhost:5432/hangar?sslmode=disable
      HANGAR_BOOTSTRAP_ADMIN_USER: admin
      HANGAR_BOOTSTRAP_ADMIN_PASSWORD: live-smoke-Pass-0123
      HANGAR_BOOTSTRAP_REQUIRE_PASSWORD_CHANGE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - name: Build hangar with the web UI
        run: make build-embed
      - name: Keys and data directories
        run: |
          set -euo pipefail
          {
            echo "HANGAR_SECRET_KEY=$(openssl rand -base64 32)"
            echo "HANGAR_DOCKER_TOKEN_KEY=$(openssl rand -base64 48)"
            echo "HANGAR_STORAGE_FS_PATH=$RUNNER_TEMP/hangar/blobs"
            echo "HANGAR_NATS_DATA_DIR=$RUNNER_TEMP/hangar/nats"
          } >> "$GITHUB_ENV"
      - name: Serve and create an admin token
        run: |
          set -euo pipefail
          nohup ./bin/hangar serve --migrate > "$RUNNER_TEMP/hangar.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/readyz
          token=$(./bin/hangar admin token create --user admin --name playwright --scopes 'repo:*:admin,system:*:admin' --expires 1d)
          echo "::add-mask::$token"
          echo "E2E_LIVE_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke against the server
        working-directory: web
        env:
          CI: "1"
          E2E_LIVE_URL: http://localhost:8080
          E2E_LIVE_USER: admin
          E2E_LIVE_PASSWORD: live-smoke-Pass-0123
        run: npx playwright test -c playwright.live.config.ts
      - name: Server log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/hangar.log"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-live-report
          path: web/playwright-report/live
          retention-days: 7

  e2e:
    name: Real-client e2e (containers, strict) and S3 on MinIO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the hangar image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hangar:e2e
          build-args: |
            VERSION=e2e
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the client image
        uses: docker/build-push-action@v7
        with:
          context: test/e2e/runner
          load: true
          tags: hangar-e2e-runner:ci
          cache-from: type=gha,scope=e2e-runner
          cache-to: type=gha,scope=e2e-runner,mode=max
      - name: Go module cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hangar-e2e/go-mod
          key: e2e-gomod-${{ hashFiles('go.sum') }}
      - name: test/e2e/run-docker.sh
        env:
          HANGAR_IMAGE: hangar:e2e
          RUNNER_IMAGE: hangar-e2e-runner:ci
        run: test/e2e/run-docker.sh

  e2e-image-scan:
    name: Image scanning e2e (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: TestImageScan with its own compose stack
        env:
          HANGAR_E2E_IMAGE_SCAN_STACK: "1"
        run: go test -tags e2e -count=1 -timeout 60m -v -run TestImageScan ./test/e2e/

  e2e-ldap:
    name: LDAP and Active Directory e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: test/e2e/ldap/run.sh
        run: test/e2e/ldap/run.sh

