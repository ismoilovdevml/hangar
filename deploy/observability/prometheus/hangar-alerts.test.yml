# Unit tests for hangar-alerts.yml:
#   promtool test rules deploy/observability/prometheus/hangar-alerts.test.yml

rule_files:
  - hangar-alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="hangar",instance="n1"}'
        values: "1 1 0 0 0 0"
      - series: 'hangar_ready{instance="n1"}'
        values: "1 0 0 0 0 0 0 0"
      - series: 'hangar_dependency_up{instance="n1",dependency="database"}'
        values: "1 0 0 0 0"
    alert_rule_test:
      - eval_time: 5m
        alertname: HangarDown
        exp_alerts:
          - exp_labels: { severity: critical, job: hangar, instance: n1 }
            exp_annotations:
              summary: "Hangar node n1 is not answering scrapes"
              description: "Prometheus could not scrape n1 for 2 minutes. The process is down, hung, or unreachable from Prometheus."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangardown"
      - eval_time: 7m
        alertname: HangarNotReady
        exp_alerts:
          - exp_labels: { severity: critical, instance: n1 }
            exp_annotations:
              summary: "Hangar node n1 fails readiness (/readyz)"
              description: "Readiness has failed for 5 minutes, so load balancers route no traffic to this node. Check hangar_dependency_up for the failing dependency."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangarnotready"
      - eval_time: 4m
        alertname: HangarDependencyDown
        exp_alerts:
          - exp_labels: { severity: critical, instance: n1, dependency: database }
            exp_annotations:
              summary: "database is unreachable from n1"
              description: "The database readiness check has failed for 2 minutes."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangardependencydown"

  - interval: 1m
    input_series:
      # 10 req/s, 1 of them 500 (10%), 0.5/s 501 not counted.
      - series: 'hangar_http_requests_total{instance="n1",method="GET",route="/x",code="200"}'
        values: "0+510x20"
      - series: 'hangar_http_requests_total{instance="n1",method="GET",route="/x",code="500"}'
        values: "0+60x20"
      - series: 'hangar_http_requests_total{instance="n1",method="GET",route="/x",code="501"}'
        values: "0+30x20"
    alert_rule_test:
      - eval_time: 8m
        alertname: HangarHigh5xxRate
        exp_alerts: []
      - eval_time: 16m
        alertname: HangarHigh5xxRate
        exp_alerts:
          - exp_labels: { severity: critical, instance: n1 }
            exp_annotations:
              summary: "10% of requests on n1 fail with 5xx"
              description: "More than 5% of requests have been answered with a server error for 10 minutes."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangarhigh5xxrate"

  - interval: 1m
    input_series:
      - series: 'hangar_upstream_state{instance="n1",repository="npmjs",state="offline"}'
        values: "1x10"
      - series: 'hangar_upstream_state{instance="n2",repository="npmjs",state="offline"}'
        values: "0x10"
      - series: 'hangar_blobstore_operations_total{instance="n1",driver="s3",op="put",result="error"}'
        values: "0+2x20"
      - series: 'hangar_jobs_total{instance="n1",type="blob.gc",result="failed"}'
        values: "0 0 1 1 1"
      - series: 'hangar_job_queue_depth{instance="n1",type="blob.gc"}'
        values: "500x40"
      - series: 'hangar_blobstore_used_bytes{instance="n1",store="default",driver="fs"}'
        values: "950x20"
      - series: 'hangar_blobstore_soft_quota_bytes{instance="n1",store="default",driver="fs"}'
        values: "1000x20"
      - series: 'hangar_blobstore_fs_free_bytes{instance="n1",store="default"}'
        values: "5x20"
      - series: 'hangar_blobstore_fs_size_bytes{instance="n1",store="default"}'
        values: "100x20"
      - series: 'hangar_db_pool_connections{instance="n1",state="acquired"}'
        values: "19x20"
      - series: 'hangar_db_pool_max_connections{instance="n1"}'
        values: "20x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: HangarUpstreamCircuitOpen
        exp_alerts:
          - exp_labels: { severity: warning, repository: npmjs }
            exp_annotations:
              summary: "Proxy remote of npmjs is offline (circuit breaker open)"
              description: "Requests for content not yet cached in npmjs fail fast; cached content is still served."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangarupstreamcircuitopen"
      - eval_time: 15m
        alertname: HangarBlobStoreErrors
        exp_alerts:
          - exp_labels: { severity: critical, instance: n1, driver: s3, op: put }
            exp_annotations:
              summary: "Blob store put errors on n1 (s3)"
              description: "20 put operations failed in 10 minutes. Uploads or downloads are failing."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangarblobstoreerrors"
      - eval_time: 3m
        alertname: HangarJobFailures
        exp_alerts:
          - exp_labels: { severity: warning, type: blob.gc }
            exp_annotations:
              summary: "Background job blob.gc failed permanently"
              description: "1 blob.gc jobs exhausted their retries in the last hour and were dropped."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangarjobfailures"
      - eval_time: 31m
        alertname: HangarJobBacklog
        exp_alerts:
          - exp_labels: { severity: warning, type: blob.gc }
            exp_annotations:
              summary: "500 blob.gc jobs are queued"
              description: "The job queue has not drained for 30 minutes: workers are failing, slow, or not running."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangarjobbacklog"
      - eval_time: 16m
        alertname: HangarBlobStoreQuotaNearLimit
        exp_alerts:
          - exp_labels: { severity: warning, store: default }
            exp_annotations:
              summary: "Blob store default uses 95% of its soft quota"
              description: "Run cleanup policies, raise the quota, or add capacity before uploads are refused."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangarblobstorequotanearlimit"
      - eval_time: 16m
        alertname: HangarBlobStoreDiskNearlyFull
        exp_alerts:
          - exp_labels: { severity: critical, instance: n1, store: default }
            exp_annotations:
              summary: "Filesystem of blob store default on n1 has 5% free"
              description: "Uploads fail once the filesystem is full."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangarblobstoredisknearlyfull"
      - eval_time: 11m
        alertname: HangarDatabasePoolSaturated
        exp_alerts:
          - exp_labels: { severity: warning, instance: n1 }
            exp_annotations:
              summary: "Database pool on n1 is 95% in use"
              description: "Requests are waiting for database connections; latency rises and requests may time out."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangardatabasepoolsaturated"

  - interval: 1m
    input_series:
      - series: 'hangar_auth_failures_total{instance="n1",method="basic",reason="bad_password"}'
        values: "0+20x20"
      - series: 'hangar_auth_lockouts_total{instance="n1"}'
        values: "0 1 2 3 4 5"
      - series: 'hangar_audit_events_rejected_total{instance="n1"}'
        values: "0 0 3 3"
      - series: 'hangar_audit_events_lost_total{instance="n1"}'
        values: "0 0 0 0"
      - series: 'hangar_blobstore_usage_age_seconds{instance="n1"}'
        values: "4000x20"
    alert_rule_test:
      - eval_time: 11m
        alertname: HangarAuthBruteForce
        exp_alerts:
          - exp_labels: { severity: warning, instance: n1 }
            exp_annotations:
              summary: "100 failed sign-ins in 5 minutes on n1"
              description: "Sustained authentication failures: a credential-guessing attempt or a client with stale credentials."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangarauthbruteforce"
      - eval_time: 5m
        alertname: HangarAccountLockouts
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "5 accounts locked in 15 minutes"
              description: "Several accounts reached the failed-login limit in a short time."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangaraccountlockouts"
      - eval_time: 3m
        alertname: HangarAuditEventsDropped
        exp_alerts:
          - exp_labels: { severity: critical, instance: n1 }
            exp_annotations:
              summary: "Audit events were dropped on n1"
              description: "3 audit events were rejected or could not be stored in 10 minutes; the audit trail is incomplete."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangarauditeventsdropped"
      - eval_time: 16m
        alertname: HangarStorageUsageStale
        exp_alerts:
          - exp_labels: { severity: warning, instance: n1 }
            exp_annotations:
              summary: "Blob store usage on n1 has not been refreshed for 1h 6m 40s"
              description: "The quota and disk alerts work on stale numbers. The usage query is failing; see the node's log."
              runbook_url: "https://github.com/ismoilovdevml/hangar/blob/main/docs/operations/runbooks.md#hangarstorageusagestale"
