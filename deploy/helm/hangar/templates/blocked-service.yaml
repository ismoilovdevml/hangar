{{- if or (and .Values.ingress.enabled .Values.ingress.blockMetrics) (and .Values.httpRoute.enabled .Values.httpRoute.blockMetrics) }}
# A Service without endpoints: the Ingress/HTTPRoute sends the metrics path
# here so it is never served through the public host.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hangar.fullname" . }}-blocked
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
    app.kubernetes.io/component: blocked
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
{{- end }}
