{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hangar.fullname" . }}
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hangar.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
        {{- range .Values.service.connectorPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.imageScanning.enabled }}
    # The scan adapter pulls the images to scan.
    - ports:
        - port: http
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "hangar.scannerSelectorLabels" . | nindent 14 }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if eq .Values.nats.mode "bundled" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "hangar.natsSelectorLabels" . | nindent 14 }}
      ports:
        - port: 4222
          protocol: TCP
        - port: 8222
          protocol: TCP
    {{- end }}
    {{- if .Values.imageScanning.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "hangar.trivySelectorLabels" . | nindent 14 }}
      ports:
        - port: 4954
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "hangar.scannerSelectorLabels" . | nindent 14 }}
      ports:
        - port: 4955
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.to }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
