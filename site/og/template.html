<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hangar social card</title>
<style>
  @font-face { font-family: 'Manrope'; font-weight: 200 800; src: url(../../assets/fonts/manrope-latin-wght-normal.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url(../../assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2'); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Manrope', sans-serif; color: #111;
    background: linear-gradient(180deg, #C9D5E7 0%, #D9DCEA 30%, #EADCE2 55%, #F6E3D8 78%, #FBF2EC 100%); position: relative; }
  .glow { position: absolute; left: 600px; top: 520px; width: 1300px; height: 560px; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(247,196,160,.8), rgba(247,196,160,.25) 55%, rgba(247,196,160,0)); }
  main { position: relative; padding: 64px 80px 0; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
  h1 { margin: 96px 0 0; font-size: 80px; line-height: 1.02; letter-spacing: -.045em; font-weight: 700; }
  p { margin: 26px 0 0; max-width: 900px; font-size: 30px; line-height: 1.35; color: #3E3E3B; font-weight: 500; }
  ul { display: flex; flex-wrap: wrap; gap: 9px; margin: 52px 0 0; padding: 0; list-style: none; max-width: 1040px; }
  li { padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.72); border: 1px solid rgba(17,17,17,.08); font-size: 20px; font-weight: 600; color: #222; }
  .url { position: absolute; right: 80px; top: 76px; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #4A4A47; }
</style>
</head>
<body>
<i class="glow"></i>
<main>
  <div class="brand">
    <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#111"/><path d="M8 24V13l8-5 8 5v11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>
    Hangar
  </div>
  <span class="url">ismoilovdevml.github.io/hangar</span>
  <h1>Self-hosted package registry</h1>
  <p>Cache what you download, store what you publish, see what is unsafe. On your own servers.</p>
  <ul>
    <li>Docker</li><li>npm</li><li>Maven</li><li>PyPI</li><li>NuGet</li><li>Go</li><li>Helm</li><li>Cargo</li><li>APT</li><li>RPM</li><li>Raw</li>
  </ul>
</main>
</body>
</html>
