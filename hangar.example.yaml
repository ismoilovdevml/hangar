# Hangar configuration reference. Copy to hangar.yaml (or hangar.local.yaml,
# which is git-ignored) and run: hangar serve --config hangar.yaml
#
# Every key below is a real setting, shown with its default (except where a
# comment says otherwise). Unknown keys are rejected at start, so typos fail
# loudly. Delete what you do not change.
#
# Every setting can be overridden by an environment variable named HANGAR_ plus
# its path in upper case joined with underscores, e.g. database.url ->
# HANGAR_DATABASE_URL, storage.s3.secret_access_key ->
# HANGAR_STORAGE_S3_SECRET_ACCESS_KEY. Lists take comma-separated values.
# Precedence: environment, then this file, then defaults.
#
# Keep secrets out of this file: put them in secrets_dir (below) or in the
# environment. Secrets: database.url (when it carries a password),
# storage.s3.secret_access_key, storage.s3.session_token, http.proxy_password,
# docker.token_key, bootstrap.admin_password, security.secret_key (alias
# HANGAR_SECRET_KEY), security.previous_secret_keys, auth.oidc.client_secret,
# auth.ldap.bind_password.
# Deployment guides: docs/deploy/.

# Directory of secret files, one per setting, named after its path in this
# file: <secrets_dir>/security.secret_key, <secrets_dir>/database.url,
# <secrets_dir>/auth.oidc.client_secret. A file's contents (trailing line
# breaks dropped) override this file; environment variables override the
# files. Names without a dot are ignored; a dotted name that is not a setting
# or an empty file stops the start. Works with Kubernetes secret volumes.
# The compose installer sets it to <data>/secrets (HANGAR_SECRETS_DIR).
secrets_dir: ""

server:
  # Listen address.
  addr: ":8080"
  # External URL clients use, without trailing slash. Every absolute link
  # Hangar generates (npm tarball URLs, the Docker token realm, Maven/PyPI
  # links) is built from it, never from the request Host header.
  base_url: "http://localhost:8080"
  # Name shown in the UI header and /api/v1/system/status.
  instance_name: hangar
  # Time allowed to read request headers (slow-header protection).
  read_header_timeout: 10s
  # Idle keep-alive connections are closed after this long.
  idle_timeout: 120s
  # Time in-flight requests (large uploads) get to finish on shutdown.
  shutdown_timeout: 30s
  # Reverse proxies / load balancers (CIDRs or IPs) whose X-Forwarded-For,
  # X-Forwarded-Proto and X-Forwarded-Host headers are trusted. Behind a proxy
  # this must list it, or every client shares the proxy's IP for rate limits
  # and audit. Requests from other peers have these headers ignored.
  trusted_proxies: []
  #  - 10.0.0.0/8
  # Name of this node on the System status and System logs screens; must be
  # unique per node. Default: empty (the host name).
  node_id: ""

log:
  level: info # debug, info, warn, error
  format: json # json or text
  # Recent records each node keeps in memory for the System logs screen
  # (100 to 100000; about 1 KiB each). Full logs stay on stderr.
  buffer_size: 5000

database:
  # PostgreSQL 16+. Default: empty (required). Set HANGAR_DATABASE_URL in
  # production; percent-encode special characters in the password.
  url: "postgres://hangar@localhost:5432/hangar?sslmode=disable"
  # Connection pool per process; size PostgreSQL max_connections for
  # nodes x max_conns plus maintenance headroom.
  max_conns: 20
  min_conns: 2
  conn_lifetime: 1h
  # Apply pending schema migrations on `hangar serve` (default false; or run
  # `hangar migrate up`). Let only one process migrate at a time.
  migrate_on_start: true

# Default blob store, registered on first start as "default".
storage:
  kind: fs # fs or s3
  fs:
    # Root directory; blobs/ and tmp/ must be on the same filesystem.
    path: ./data/blobs
  s3:
    endpoint: "" # e.g. http://minio:9000; empty = AWS
    region: us-east-1 # default ""
    bucket: hangar # default "" (required for kind=s3)
    # Key prefix inside the bucket, e.g. "hangar/".
    prefix: ""
    # Static credentials. Leave both empty for the AWS default chain
    # (environment, shared config, IRSA / EKS Pod Identity, instance profile).
    access_key_id: ""
    secret_access_key: "" # use HANGAR_STORAGE_S3_SECRET_ACCESS_KEY
    # Temporary credentials only.
    session_token: "" # use HANGAR_STORAGE_S3_SESSION_TOKEN
    # Path-style URLs (MinIO and most S3-compatible services); false for AWS.
    use_path_style: true # default false
    # PEM bundle trusted for the endpoint (private CA).
    ca_file: ""
    # Multipart part size in bytes, 5 MiB to 5 GiB; 0 = 16 MiB.
    part_size: 0
  # Blob garbage collection (job blob.gc, run daily by the leader node).
  gc:
    # How long an unreferenced blob is kept before its bytes are deleted.
    # Must be longer than 24h (the Docker upload session lifetime). Backups of
    # the blob store must finish within this period after the database dump.
    grace_period: 48h
    # Blobs deleted per transaction.
    batch_size: 100
    # Abandoned temporary uploads older than this are removed; negative
    # disables temp cleanup.
    temp_max_age: 24h

nats:
  # Single node: run NATS JetStream inside the hangar process. Several nodes:
  # embedded=false and url pointing at a NATS cluster with JetStream.
  embedded: true
  # Embedded JetStream state.
  data_dir: ./data/nats
  # Expose the embedded server (host:port); empty = in-process only.
  listen: ""
  # External cluster, e.g. nats://user:password@nats:4222.
  url: ""

# Outbound HTTP for proxy repositories (Maven Central, npmjs, Docker Hub, ...).
# Each proxy repository inherits these settings and can override proxy, CA
# bundle, TLS verification and timeouts for its own remote.
http:
  # Corporate outbound proxy: http://, https:// or socks5:// URL.
  proxy: "" # e.g. http://proxy.corp.example:3128
  proxy_username: ""
  proxy_password: "" # use HANGAR_HTTP_PROXY_PASSWORD
  # Hosts, domain suffixes and CIDRs reached directly.
  no_proxy: []
  #  - .corp.example
  #  - 10.0.0.0/8
  # When proxy is empty, honour HTTP_PROXY / HTTPS_PROXY / NO_PROXY.
  use_environment: true
  # PEM bundle trusted in addition to system roots (TLS-inspecting proxies, private CAs).
  ca_file: ""
  connect_timeout: 10s
  # Max wait for response headers; body transfer is bounded per request.
  read_timeout: 60s
  idle_conn_timeout: 90s
  max_idle_conns: 200
  max_idle_conns_per_host: 32
  user_agent: "" # default Hangar/<version>
  # Internal addresses proxy repositories may reach. The outbound address
  # policy blocks loopback, private, link-local (cloud metadata) and similar
  # ranges by default: list CIDRs, IPs, host names or ".domain" suffixes of
  # internal mirrors here.
  allow_private_networks: []
  #  - 10.20.0.0/16
  #  - .corp.example

# Local authentication.
auth:
  # argon2id cost. Hashes made with other parameters keep working and are
  # re-hashed on the next successful login.
  argon2:
    memory_kib: 65536
    iterations: 3
    parallelism: 2
    salt_length: 16
    key_length: 32
  # Simultaneous argon2 computations (each uses memory_kib).
  max_concurrent_hashes: 4
  password:
    min_length: 12 # at least 8
    max_length: 256
    # Character classes required (lower, upper, digit, other).
    min_classes: 0
    # Allow passwords that contain the user name.
    allow_username: false
  # Lock an account after max_attempts failed passwords within window, for
  # duration. A negative max_attempts disables lockout.
  lockout:
    max_attempts: 5
    window: 15m
    duration: 15m
  # Browser sessions.
  session:
    ttl: 12h
    # Lifetime with "remember me".
    remember_ttl: 720h
    cookie_name: hangar_session
    csrf_cookie_name: hangar_csrf
    csrf_header: X-CSRF-Token
    # Drop the Secure cookie attribute. Only for plain-HTTP setups other than
    # localhost; never in production.
    insecure: false
  # Default lifetime of short-lived tokens (registry bearer tokens, CLI logins).
  session_token_ttl: 15m
  max_session_token_ttl: 24h
  # Cap on personal and service-account token expiry.
  max_token_lifetime: 8784h
  # Tokens expiring within this period are flagged to their owner.
  token_expiry_warning: 336h
  # Verified Basic credentials are remembered this long, so clients that send
  # them on every request (Maven, pip) skip argon2. Negative disables.
  basic_cache_ttl: 2m
  # Authorization decisions are cached; other cluster nodes see role changes
  # after at most this long.
  authz_cache_ttl: 5s
  # Login attempts per client IP. A negative per_minute disables the limit.
  login_rate:
    per_minute: 10
    burst: 10
  # How often token and user last-used times are written back.
  usage_flush_interval: 30s

  # Single sign-on with an OpenID Connect provider (Keycloak, Entra ID,
  # Okta, Authentik, Dex ...): authorization code flow with PKCE (S256).
  # Register the redirect URI <server.base_url>/api/v1/auth/oidc/callback.
  # See docs/guides/sso.md.
  oidc:
    enabled: false
    issuer_url: "" # e.g. https://sso.example.com/realms/acme
    client_id: ""
    client_secret: "" # use HANGAR_AUTH_OIDC_CLIENT_SECRET; empty for a public client
    # How the secret reaches the token endpoint: basic (client_secret_basic)
    # or post (client_secret_post).
    client_auth: basic
    display_name: SSO # "Continue with SSO"
    # Do not add "groups": groups arrive through a claim mapper, and some
    # providers reject unknown scopes.
    scopes: [openid, profile, email]
    # Claims; a dotted path reaches into objects (realm_access.roles).
    username_claim: preferred_username
    email_claim: email
    name_claim: name
    groups_claim: groups
    # Group -> roles. Names match case-insensitively and with or without a
    # leading "/" (Keycloak full group paths). Mapped roles are re-synced on
    # every sign-in; roles an administrator binds by hand are kept.
    # Env: HANGAR_AUTH_OIDC_GROUP_ROLES='{"hangar-admins":["Admin"]}'.
    group_roles: {}
    #   hangar-admins: [Admin]
    #   devops: [Publisher]
    default_roles: [] # e.g. [Reader]: every SSO user
    allowed_groups: [] # non-empty: only members of these groups may sign in
    auto_create: true # false: only users who signed in before are admitted
    insecure_skip_verify: false # never in production; use ca_file
    ca_file: "" # PEM bundle for a private CA
    timeout: 10s

  # Sign-in with an LDAP directory or Active Directory: the login form's
  # directory toggle (realm "ldap") and HTTP Basic from package clients.
  ldap:
    enabled: false
    url: "" # ldaps://dc1.example.com:636 or ldap://dc1.example.com:389
    start_tls: false # upgrade ldap:// before binding
    insecure_skip_verify: false
    ca_file: ""
    # Service account that searches users and groups (both empty: anonymous).
    bind_dn: "" # e.g. CN=svc-hangar,OU=Service Accounts,DC=example,DC=com
    bind_password: "" # use HANGAR_AUTH_LDAP_BIND_PASSWORD
    user_base_dn: "" # e.g. OU=People,DC=example,DC=com
    # {username} is replaced by the escaped login name. OpenLDAP:
    # (&(objectClass=inetOrgPerson)(uid={username})) with username_attribute uid.
    user_filter: "(&(objectClass=user)(sAMAccountName={username}))"
    username_attribute: sAMAccountName
    email_attribute: mail
    name_attribute: displayName
    # Groups from this attribute of the user entry ...
    group_attribute: memberOf
    # ... or, when group_base_dn is set, from a search under it ({dn} is the
    # user's DN, {username} the login name).
    group_base_dn: ""
    # Empty: (member={dn}), or (member:1.2.840.113556.1.4.1941:={dn}) with
    # nested_groups.
    group_filter: ""
    group_name_attribute: cn
    # Active Directory nested groups (LDAP_MATCHING_RULE_IN_CHAIN); needs
    # group_base_dn.
    nested_groups: false
    # Group -> roles; a group matches by DN or by name (its first RDN value).
    group_roles: {}
    #   Hangar Admins: [Admin]
    default_roles: []
    allowed_groups: []
    auto_create: true
    timeout: 10s

docker:
  # Signs Docker registry tokens and upload URLs (HMAC). At least 32 random
  # bytes (`openssl rand -base64 48`); every node needs the same value. Empty:
  # a random per-process key, so registry logins and unfinished uploads do not
  # survive a restart or work across nodes.
  token_key: "" # use HANGAR_DOCKER_TOKEN_KEY

# First administrator, created on start when both are set and no enabled
# administrator exists. Nothing changes once one exists; remove them after
# the first sign-in. Alternative: `hangar admin bootstrap`.
#
# Without admin_user, the first start of an empty installation creates the
# local user "admin" with a one-time password: read from
# initial_password_file when that file holds one, otherwise generated,
# printed once to standard error and written to initial_password_file (mode
# 0600). The file is deleted after the administrator sets a new password.
bootstrap:
  admin_user: ""
  admin_password: "" # use HANGAR_BOOTSTRAP_ADMIN_PASSWORD
  # The administrator created from admin_user / admin_password or by
  # `hangar admin bootstrap` must set a new password at the first sign-in.
  # Set to false for automated setups that use the password as given.
  require_password_change: true
  initial_password_file: "" # e.g. /var/lib/hangar/secrets/initial-admin-password

scanner:
  # Reserved for container image scanning (not active yet): Docker images
  # show "image scanning not configured".
  trivy_url: ""

# Vulnerability scanning of npm, Maven, PyPI, NuGet and Go packages against
# the OSV advisory database. Guide: docs/guides/vulnerabilities.md.
scanning:
  # Scan on arrival (repositories with scan_on_arrival), on demand and in the
  # hourly "vulnerability-rescan" task. HANGAR_SCANNING_ENABLED.
  enabled: true
  # A component is checked again for new advisories once its last scan is
  # older than this (at least 1h). HANGAR_SCANNING_RESCAN_INTERVAL.
  rescan_interval: 24h
  # A vulnerable version downloaded within this window counts as "in use" in
  # the fix plan of the Vulnerabilities screen (24h..2160h).
  # HANGAR_SCANNING_IN_USE_WINDOW.
  in_use_window: 720h
  osv:
    # OSV API root, or an internal mirror serving the same API. Requests go
    # through the `http` section (proxy, CA bundle); list a mirror on a
    # private address in http.allow_private_networks.
    # HANGAR_SCANNING_OSV_URL.
    url: https://api.osv.dev

metrics:
  # Serve Prometheus metrics (no authentication: keep the path off public
  # hosts). Metrics are recorded either way for the Overview screen.
  enabled: true
  path: /metrics

# Encryption of stored credentials and HTTP hardening. See docs/security.md.
security:
  # 32 random bytes, base64 or hex: `openssl rand -base64 32`. Encrypts proxy
  # upstream credentials and S3 keys stored in the database. Set it through
  # HANGAR_SECRET_KEY; every node needs the same value and backups need it to
  # be useful. Without it, repositories and blob stores that carry credentials
  # are refused.
  secret_key: ""
  # Keys that still decrypt values after a rotation (comma-separated in
  # HANGAR_SECURITY_PREVIOUS_SECRET_KEYS). Run `hangar admin rotate-secrets`,
  # then remove them.
  previous_secret_keys: []
  # Strict-Transport-Security, sent on HTTPS requests only (TLS, or
  # X-Forwarded-Proto: https from server.trusted_proxies). 0 disables.
  hsts:
    max_age: 8760h
    include_subdomains: false
  # Browser origins other than server.base_url allowed to call Hangar.
  cors:
    allowed_origins: []
  # Per client IP; per_minute: 0 disables a limit.
  rate_limit:
    api: { per_minute: 1200, burst: 300 }
    # Failed authentications (401) on the API and package endpoints. When a
    # client runs out, its requests carrying credentials answer 429.
    failed_auth: { per_minute: 30, burst: 30 }
  limits:
    max_header_bytes: 131072
    api_body_bytes: 1048576
    upload_body_bytes: 0 # 0 = unlimited; uploads are streamed
    # A request body that sends nothing for this long is aborted.
    body_idle_timeout: 2m

# Tracing and access log. Metrics and the log format are configured above;
# see docs/operations/monitoring.md for every metric, log field and span.
observability:
  tracing:
    # Export OpenTelemetry traces over OTLP/HTTP.
    enabled: false
    # Collector URL; without a path /v1/traces is used. Collector auth headers
    # come from OTEL_EXPORTER_OTLP_HEADERS.
    endpoint: "" # e.g. http://otel-collector:4318
    # Share of new traces recorded (0 to 1). Requests carrying a sampled W3C
    # traceparent header are always recorded.
    sample_ratio: 0.1
    service_name: hangar
  access_log:
    # Share of requests written to the access log (0 to 1). Server errors
    # (5xx) are always logged.
    sample_ratio: 1

# Web UI.
ui:
  # Images in package READMEs that live on other hosts (badges, logos):
  #   proxy  - Hangar fetches them (outbound proxy and address policy of the
  #            `http` section, https only, 5 MiB, images only, cached 24h) and
  #            serves them from its own origin. Browsers contact no other host.
  #   direct - browsers load https images from their hosts. Simpler, but each
  #            host learns the viewer's IP address and when a README is read.
  #   off    - only the image's alternative text is shown.
  # Images stored inside the package are always served by Hangar.
  # HANGAR_UI_README_IMAGES.
  readme_images: proxy
  # Load http:// README images over plain HTTP instead of upgrading them to
  # https://. HANGAR_UI_README_IMAGES_ALLOW_HTTP.
  readme_images_allow_http: false
