name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (vet, test)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hangar
          POSTGRES_PASSWORD: hangar
          POSTGRES_DB: hangar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hangar -d hangar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HANGAR_TEST_DATABASE_URL: postgres://hangar:hangar@localhost:5432/hangar_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./cmd/... ./internal/... && go vet -tags e2e ./test/e2e/... && go vet -tags webui ./internal/webui/
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out ./cmd/... ./internal/... ./test/...
      - name: build
        run: make build

  golangci:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./internal/...

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Detect web app
        id: detect
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "web/package.json not found, skipping"; fi
      - uses: actions/setup-node@v5
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web ci
      - name: lint
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web run lint
      - name: typecheck
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web run typecheck
      - name: test
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web run test
      - name: build
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web run build

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: [go]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hangar:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: docker run --rm hangar:ci version
      - name: Build the scan adapter image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/scanner/Dockerfile
          push: false
          load: true
          tags: hangar-scanner:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,scope=scanner,mode=max
      - name: Smoke test the scan adapter image
        run: |
          docker run --rm hangar-scanner:ci version
          docker run --rm --entrypoint trivy hangar-scanner:ci --version
