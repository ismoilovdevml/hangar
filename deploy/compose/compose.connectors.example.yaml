# Docker port connectors: a Docker repository configured with
# "connector": {"http_port": 5001} gets its own plain-HTTP listener inside the
# hangar container. Publish each such port with an override file in the data
# directory, which Docker Compose loads automatically and the installer
# never touches:
#
#   cd /srv/hangar
#   cp compose.connectors.example.yaml compose.override.yaml   # edit ports
#   docker compose up -d
#
# Connector ports speak plain HTTP. Keep them on loopback or a trusted network
# (Docker clients need them listed in "insecure-registries"), or prefer a host
# connector ("connector": {"host": "cr.example.com"}) behind Caddy with TLS.

services:
  hangar:
    ports:
      - "127.0.0.1:5001:5001"
